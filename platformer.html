/* Draw one imported frame, sized by HEIGHT.

   Height, not width, because imported art sets its own proportions — this
   ranger is 19x53, an aspect of 0.36 against the built-in maps' 0.75. Fitting
   by width would make it three times too tall. The hitbox follows the art's
   aspect for the same reason (see adopt), so what you collide with is what you
   can see. */
function drawSheetFrame(P, fi, cx, cy, hPx, face, alpha, feather){
  const S = SPRITE, str = S.frames[fi];
  if (!str) return;
  const px = hPx / S.h, half = px * .5;
  const x0 = cx - (S.w * px) / 2, y0 = cy - hPx / 2;
  const flip = S.mirror && face < 0;
  /* an imported sprite gets the same pad as the built-in body: solid ground
     squares on its silhouette ring, retiring over dense ink for the same
     reason drawPixmap's does */
  const padAl = (.25 + .75 * (1 - (feather || 0))) * alpha;
  const rims = S.rims[fi];
  for (let n = 0; n < rims.length; n++){
    const i = rims[n], r = (i / S.w) | 0, c = i - r * S.w;
    const cc = flip ? (S.w - 1 - c) : c;
    P.pushPx(x0 + cc * px + half, y0 + r * px + half, half, GL_SQUARE,
             RGBV.ground, padAl);
  }
  if (S.rim){
    const rim = S.rims[fi];
    for (let n = 0; n < rim.length; n++){
      const i = rim[n], r = (i / S.w) | 0, c = i - r * S.w;
      const cc = flip ? (S.w - 1 - c) : c;
      P.pushPx(x0 + cc * px + half, y0 + r * px + half, half, GL_SQUARE, RGBV.bone, .30 * alpha);
    }
  }
  for (let r = 0, i = 0; r < S.h; r++){
    const ry = y0 + r * px + half;
    for (let c = 0; c < S.w; c++, i++){
      const k = S.idx[str.charCodeAt(i)];
      if (!k) continue;                                  /* 0 is transparent */
      const cc = flip ? (S.w - 1 - c) : c;
      P.pushPx(x0 + cc * px + half, ry, half, GL_SQUARE, S.pal[k - 1], alpha);
    }
  }
}

/* Draw a pixel map centred on a screen position — as hard DIAMONDS, one per
   art-pixel, so the body is cut from the same cloth as the lattice (4.0: one
   theme, everything diamonds). Drawn through pushRot at f=1 because the 2D
   fallback's pushPx only knows rectangles, and at .58 of the pitch so
   neighbouring diamonds interlock enough to read as a body.

   Two rules found on screen, both deliberate:
   - Every opaque art-pixel first lays a hard GROUND-colour square, so the
     picture disappears where the body covers it — the gaps between the
     body's diamonds must never let the lattice show through as if the
     runner were transparent. And the silhouette does not stop dead: every
     transparent cell near the body measures its true distance to the
     nearest solid pixel, and the pad falls off along it — tight, one cell
     of real weight and a whisper past it (brought in a pixel, 22 Aug
     2026). Only the touching cell (d=1) is a near-opaque ground SQUARE,
     because squares tile and a jittered lattice diamond can never slip
     between them to sit glowing against the silhouette; the corner cell
     (d=√2) is already a diamond, so the pad's outline scallops instead of
     stair-stepping, and d=2 is a faint tail. And the pad knows when it is
     not wanted: `feather` (0..1, the eased ink density under the body —
     see the halo field) RETIRES it. Over sparse, scrappy ink the dark
     ring separates the body from stray pixels; over a plain heavy white
     patch that same ring reads as a hole punched in the picture, so there
     it fades to a hint (found on screen, 22 Aug 2026). The loop walks two
     cells outside the art rectangle so the tail is not clipped by it.
   - `holes` (art-pixels away mid-churn, r * cols + art column in
     facing-right art space) only open where the CURRENT frame calls them
     rim. The animation shears the silhouette a column either way, and a
     hole that was rim when it was torn can sit interior one frame later —
     drawn solid until the rim comes back to it, so the middle never breaks.
     The backing square stays even for an open hole: a notch in the body is
     body-shaped absence, not a window. */
function drawPixmap(P, map, cx, cy, wPx, face, alpha, holes, feather){
  const rows = map.length, cols = map[0].length;
  const px = wPx / cols;                        /* one art-pixel, in device px */
  const half = px * .5;
  const x0 = cx - wPx / 2, y0 = cy - (rows * px) / 2;
  const solid = (rr, aa) => rr >= 0 && rr < rows && aa >= 0 && aa < cols &&
                            map[rr][aa] !== '.';
  const f = feather || 0, inv = 1 - f;
  for (let r = -2; r < rows + 2; r++){
    const line = r >= 0 && r < rows ? map[r] : '';
    for (let c = -2; c < cols + 2; c++){
      const ai = face < 0 ? (cols - 1 - c) : c;
      const key = line[ai];
      const x = x0 + c * px + half, y = y0 + r * px + half;
      if (!key || key === '.'){
        /* squared distance to the nearest solid art-pixel, out to 2 cells */
        let d2 = 9;
        for (let dr2 = -2; dr2 <= 2; dr2++)
          for (let dc2 = -2; dc2 <= 2; dc2++)
            if ((dr2 || dc2) && dr2 * dr2 + dc2 * dc2 < d2 &&
                solid(r + dr2, ai + dc2)) d2 = dr2 * dr2 + dc2 * dc2;
        if (d2 === 1)                        /* touching: own the edge */
          P.pushPx(x, y, half, GL_SQUARE, RGBV.ground,
                   .95 * (.25 + .75 * inv) * alpha);
        else if (d2 === 2)                   /* corner: a soft scallop */
          P.pushRot(x, y, px * .84, 1, RGBV.ground, .55 * inv * alpha);
        else if (d2 === 4)                   /* the tail: a whisper */
          P.pushRot(x, y, px * .55, 1, RGBV.ground, .16 * inv * alpha);
        continue;
      }
      P.pushPx(x, y, half, GL_SQUARE, RGBV.ground, alpha);
      if (holes && holes.size && holes.has(r * cols + ai) &&
          !(solid(r - 1, ai) && solid(r + 1, ai) &&
            solid(r, ai - 1) && solid(r, ai + 1))) continue;
      const col = SPAL[key];
      if (!col) continue;
      P.pushRot(x, y, px * .58, 1, col, alpha);
    }
  }
}

/* ── the world: cells are the unit ────────────────────────────────────────────
   One cell is one unit, so every speed is quoted in cells per second and
   changing the grain changes how big the picture is without changing how the
   runner feels. The constants below are quoted for a body 2.7 cells tall — the
   height the platformer's jump envelope was measured at — and rescaled to
   whatever body this grain actually gives.                                  */
const PHYS0 = {
  /* Run was 14 with an accel of 78, which is 5.2 body-heights a second reached
     in a fifth of one — the character arrived at top speed before you had
     finished pressing the key, and every correction overshot. The top speed
     matters less than the ramp: 44 takes about half a second to get there, so
     a tap is a step and a hold is a run. Note that reach across the gutter
     falls with maxRun — see GUTTER, and assertion 14. */
  gravity: 62, maxFall: 42, accel: 44, friction: 60, airAccel: 30,
  maxRun: 10, jump: 30, jumpCut: 7, climb: 9, climbSide: 5,
};
const REF_BODY = 2.7;
const COYOTE = .10, BUFFER = .12;
/* The character is 7.5% of the screen's height at SIZE 1 — Mario is about 7%
   of an NES screen. SIZE scales the BODY, which is the one number the art, the
   hitbox and every speed in PHYS are all derived from, so a bigger character
   is bigger in exactly the way a bigger character should be: it covers more
   ground per second and jumps the same height measured in its own body. What
   it is not is a zoom — the picture does not change, so a big character has a
   coarser world to move through and a small one a finer one. */
const BODY_FRAC = .075;
const SIZE_DEF = 1.5;       /* chosen on screen, 21 Aug 2026 */
const HALO = QS.get('halo') !== '0';
let SIZE = (function(){
  const v = parseFloat(QS.get('size') || '');
  return v >= 40 && v <= 260 ? v / 100 : SIZE_DEF;
})();

const keys = Object.create(null);

const game = {
  grid: null, solid: null, cols: 0, rows: 0,
  bw: 1.7, bh: 2.7, phys: Object.assign({}, PHYS0),
  p: null,                                 /* the runner */
  idleSince: 0,                            /* for the auto-cycle hold */
  dens: null, dcols: 0, drows: 0, dstep: 4,            /* ink-density field */
  densDirty: false,                        /* rebuild only when ink moved */
  featherK: 0,                             /* eased halo strength, 0..1 */

  solidAt(cx, cy){
    if (!this.solid) return false;
    if (cx < 0 || cx >= this.cols || cy < 0 || cy >= this.rows) return false;
    return this.solid[cy * this.cols + cx] === 1;
  },
  overlaps(x, y, w, h){
    const x0 = Math.floor(x - w/2), x1 = Math.floor(x + w/2 - 1e-6);
    const y0 = Math.floor(y - h/2), y1 = Math.floor(y + h/2 - 1e-6);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++)
      if (this.solidAt(cx, cy)) return true;
    return false;
  },
  /* Is there line to hold on to? Most of a picture is not floor, it is
     scaffolding — so anything solid within a third of a cell of the body counts
     as climbable. That is what makes an arbitrary photo climbable at all
     rather than a set of isolated ledges. */
  onLine(p){
    const r = .34 * (this.bh / REF_BODY);
    return this.overlaps(p.x - r, p.y, this.bw, this.bh) ||
           this.overlaps(p.x + r, p.y, this.bw, this.bh) ||
           this.overlaps(p.x, p.y - r, this.bw, this.bh) ||
           this.overlaps(p.x, p.y + r, this.bw, this.bh);
  },
  /* Nearest surface to the middle of the picture, searched outwards from
     centre so the runner arrives somewhere you are already looking.

     The clearance test is overlaps() itself — the exact test collision will
     run a tick later — and not a hand-rolled scan of the column above. A body
     is about five cells tall AND three cells wide at the default grain, so
     checking one column's headroom passes a spot whose neighbouring columns
     bury the shoulders, and the runner arrives already refused by the wall it
     is standing in. Every "the character is stuck" report traces back here.

     If no column in the picture has room, drop in from above the top edge and
     let gravity find somewhere — a fall that lands is always better than a
     spawn that cannot move. */
  spawnPoint(){
    const midX = this.cols >> 1;
    let sawInk = false;
    for (let d = 0; d < this.cols; d++){
      for (const x of (d ? [midX - d, midX + d] : [midX])){
        if (x < 1 || x >= this.cols - 1) continue;
        for (let y = 1; y < this.rows; y++){
          if (!this.solidAt(x, y)) continue;
          sawInk = true;
          const cy = y - this.bh / 2 - .05;
          /* on the picture, and on the SCREEN. The topmost surface of a
             column can be a fingertip at the very top of the frame, which
             spawns a body half of it above the canvas. */
          if (cy - this.bh / 2 >= .5 && !this.overlaps(x + .5, cy, this.bw, this.bh))
            return {x: x + .5, y: cy};
          break;                       /* only the topmost surface of a column */
        }
      }
    }
    return {x: this.cols * .5, y: sawInk ? -1 : this.rows * .25};
  },
  respawn(){
    const s = this.spawnPoint();
    const p = this.p || (this.p = {face:1, anim:0});
    p.x = s.x; p.y = s.y; p.vx = 0; p.vy = 0;
    p.onGround = false; p.climbing = false;
    p.coyote = 0; p.buffer = 0; p.held = false;
  },
  /* A new picture has settled. It is the ground now — so re-measure the body
     for this grain, rescale the physics, and put the runner somewhere legal.
     Standing inside the new form is the common case and only needs a lift; a
     runner left in open air just falls, which is the right answer. */
  adopt(grid){
    if (!grid || !grid.solid) return;
    /* A body's position is in CELLS, so it only means the same thing on a grid
       of the same shape. Carrying it across a change of geometry is carrying a
       number, not a place: the boot placeholder is 72 columns and the real
       picture is 256, so a runner standing on the placeholder's frame arrives
       near the top-left corner of the photograph, half of it above the screen,
       standing on whatever cell happens to be under it. Same shape — a merge
       from one face to the next at the same grain — is the case where carrying
       it is exactly right, and the only one. */
    const sameShape = (grid.cols === this.cols && grid.rows === this.rows);
    this.grid = grid; this.solid = grid.solid;
    this.cols = grid.cols; this.rows = grid.rows;
    this.measure();
    this.setupQuest(grid);
    this.buildDens(grid);
    if (!this.p || !sameShape){ this.respawn(); return; }
    this.p.x = Math.min(this.cols - 1, Math.max(1, this.p.x));
    if (this.p.y > this.rows + 4 || this.p.y < -this.bh - 8) this.respawn();
    else this.unstick(this.p);
  },
  /* ── THE HALO FIELD ─────────────────────────────────────────────────────
     The pad around the body is not a constant: it answers the ink. Over
     sparse, scrappy ink it separates the body from stray pixels, but over a
     plain heavy white patch a dark ring reads as a hole punched in the
     picture — so there it retires (see drawPixmap). This field is the
     answer's source — the picture's lit
     cells binned four-a-side, box-blurred once so the halo swells as heavy
     ink APPROACHES rather than snapping at its border, and normalised
     against this picture's own peak (at .8 of it, so the top of the range
     saturates): "dense" means dense compared to the rest of THIS picture,
     which is the only comparison the eye is making.

     Built from the live skin, not the map — the map is a threshold, but the
     halo should answer what is actually glowing, hidden and gone cells
     excluded. The quest moves ink from one panel to the other, so the field
     is rebuilt when the quest actually moves ink (densDirty) rather than on
     a clock: a rebuild is a few milliseconds, which is a whole frame at
     144Hz, and a periodic whole frame is a visible periodic hitch.        */
  buildDens(grid){
    if (!grid) return;
    const DS = this.dstep;
    const cells = grid._live ? grid._live.cells : grid.cells;
    if (!cells || !cells.length){ this.dens = null; return; }
    const dc = Math.max(1, Math.ceil(grid.cols / DS));
    const dr = Math.max(1, Math.ceil(grid.rows / DS));
    const raw = new Float32Array(dc * dr);
    for (const c of cells){
      if (c.gone || c.hidden) continue;
      const d = c.d || c;
      raw[((c.y / DS) | 0) * dc + ((c.x / DS) | 0)] +=
        (d.al === undefined ? 1 : d.al) * (d.sz || 1);
    }
    const f = new Float32Array(dc * dr);
    let max = 0;
    for (let y = 0; y < dr; y++) for (let x = 0; x < dc; x++){
      let sum = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= dc || yy >= dr) continue;
        sum += raw[yy * dc + xx]; n++;
      }
      const v = sum / n;
      f[y * dc + x] = v;
      if (v > max) max = v;
    }
    if (max > 0){
      const inv = 1 / (max * .8);
      for (let i = 0; i < f.length; i++) f[i] = Math.min(1, f[i] * inv);
    }
    this.dens = f; this.dcols = dc; this.drows = dr;
    this.densDirty = false;
  },
  densAt(x, y){
    if (!this.dens) return 0;
    const fx2 = x / this.dstep - .5, fy2 = y / this.dstep - .5;
    const x0 = Math.floor(fx2), y0 = Math.floor(fy2);
    const tx = fx2 - x0, ty = fy2 - y0;
    const v = (xx, yy) => {
      xx = Math.max(0, Math.min(this.dcols - 1, xx));
      yy = Math.max(0, Math.min(this.drows - 1, yy));
      return this.dens[yy * this.dcols + xx];
    };
    return v(x0, y0) * (1 - tx) * (1 - ty) + v(x0 + 1, y0) * tx * (1 - ty) +
           v(x0, y0 + 1) * (1 - tx) * ty + v(x0 + 1, y0 + 1) * tx * ty;
  },

  /* ── THE WAKE ───────────────────────────────────────────────────────────
     The lattice should know something moved through it. Cells overlapping the
     body get shoved away from it and brighten, then decay back over a few
     hundred milliseconds.

     It deliberately does NOT touch the row you are standing on or anything
     below it: the floor rippling under your feet reads as the ground giving
     way, which is a promise this game does not keep. What it does touch is ink
     you walk *through* and ink you climb, which is most of a picture — the
     hand's whole interior is unlit, unwalkable, and yours to wade across.

     Only disturbed cells are tracked, so the decay loop is over a handful of
     cells rather than the eight thousand on screen. */
  wake: [],
  disturb(dt){
    const p = this.p, L = this.grid && this.grid._live;
    if (!p || !L || !this.cellAt) return;
    const k = Math.pow(.0025, dt);
    for (let i = this.wake.length - 1; i >= 0; i--){
      const c = this.wake[i];
      c.wx *= k; c.wy *= k; c.wk *= k;
      if (Math.abs(c.wx) + Math.abs(c.wy) + c.wk < .02){
        c.wx = 0; c.wy = 0; c.wk = 0; c._inWake = false;
        this.wake[i] = this.wake[this.wake.length - 1];
        this.wake.pop();
      }
    }
    const speed = Math.hypot(p.vx, p.vy);
    if (speed < .5) return;
    const pitch = this.grid.p;
    const halfW = this.bw / 2 + .6, halfH = this.bh / 2 + .6;
    const x0 = Math.floor(p.x - halfW), x1 = Math.floor(p.x + halfW);
    const y0 = Math.floor(p.y - halfH), y1 = Math.floor(p.y + halfH);
    const floorRow = p.onGround ? Math.floor(p.y + this.bh / 2) : Infinity;
    const amp = Math.min(1, speed / (this.phys.maxRun * .8));
    const cap = pitch * .5;
    for (let cy = y0; cy <= y1; cy++){
      if (cy >= floorRow) continue;
      for (let cx = x0; cx <= x1; cx++){
        const c = this.cellAt.get(cy * this.cols + cx);
        if (!c || c.gone || c.hidden) continue;
        const dx = (cx + .5) - p.x, dy = (cy + .5) - p.y;
        const d = Math.hypot(dx, dy) || 1;
        const fall = 1 - Math.min(1, d / (halfW + halfH));
        if (fall <= 0) continue;
        const push = amp * pitch * .30 * fall;
        c.wx = Math.max(-cap, Math.min(cap, (c.wx || 0) + (dx / d) * push * .4));
        c.wy = Math.max(-cap, Math.min(cap, (c.wy || 0) + (dy / d) * push * .4));
        c.wk = Math.min(1, (c.wk || 0) + amp * fall * .3);
        if (!c._inWake){ c._inWake = true; this.wake.push(c); }
      }
    }
  },

  /* ── THE TRANSFER ───────────────────────────────────────────────────────
     One pile of diamonds in two vessels. The left picture starts whole and the
     right one starts empty; clusters of colour surface in the left one at
     random, and carrying one over reveals a proportional share of the right.
     The left loses exactly what it gives, so emptying the source is the same
     event as completing the destination — there is no separate win condition
     to keep in sync.

     Proportional, not one-for-one, because the two pictures have different
     numbers of diamonds in them: the ratio is fixed once, at setup, from the
     two totals.

     The right panel's MAP is gated on the same progress, so the faces are not
     an invisible platform you can stand on before you have built them. The
     left panel's map is not gated — the hand stays walkable as it empties, or
     the game would take the floor away from the player doing the work. */
  quest: null,
  fxq: [],                                 /* motes in flight */
  holes: new Set(),                        /* art-pixels away from the body */
  exq: [],                                 /* diamonds and squares mid-swap */
  lentQ: [],                               /* cells the body owes, oldest first */
  exNext: 0,
  setupQuest(grid){
    const L = grid._live;
    this.cellAt = new Map();
    this.wake = [];
    for (const f of this.exq) if (f.t === 'out') f.cell.lent = false;
    for (const c of this.lentQ) c.lent = false;
    this.exq.length = 0;
    this.lentQ.length = 0;
    this.holes.clear();
    this.exNext = 0;
    if (!L) return;
    for (const c of L.cells) this.cellAt.set(c.y * grid.cols + c.x, c);
    if (this.quest && this.quest.grid === grid) return;   // keep progress
    this.quest = null;
    this.fxq = [];
    if (PANELS < 2) return;
    const split = grid.cols / PANELS;
    const left = [], right = [];
    for (const c of L.cells){
      c.gone = false; c.hidden = false; c.clus = null;
      c.veil = false; c.lent = false;
      c.wx = 0; c.wy = 0; c.wk = 0; c._inWake = false;
      (c.x < split ? left : right).push(c);
    }
    if (!left.length || !right.length) return;
    /* Scattered, not core-out: the arrival order is a straight shuffle, so
       each mote lands in a random place and the right picture densifies
       everywhere at once instead of growing from its middle. The map order
       is shuffled too, so the ground arrives as scattered as the light. */
    const shuffle = a => {
      for (let i = a.length - 1; i > 0; i--){
        const j = (Math.random() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    };
    shuffle(right);
    for (const c of right) c.hidden = true;

    const mapOrder = [];
    for (let y = 0; y < grid.rows; y++)
      for (let x = Math.ceil(split); x < grid.cols; x++)
        if (grid.solid[y * grid.cols + x]) mapOrder.push(y * grid.cols + x);
    shuffle(mapOrder);
    for (const i of mapOrder) grid.solid[i] = 0;

    this.quest = {
      grid, left, right, mapOrder,
      leftTotal: left.length, rightTotal: right.length,
      ratio: right.length / left.length,
      taken: 0, revealed: 0, mapRevealed: 0,
      size: Math.max(24, Math.round(left.length / 28)),
      cl: null, next: 0, done: false, hue: 0,
    };
    this.showProgress();
  },
  revealTo(n){
    const q = this.quest, g = q.grid;
    n = Math.min(q.rightTotal, Math.max(0, Math.round(n)));
    while (q.revealed < n) q.right[q.revealed++].hidden = false;
    if (q.revealed > 0) this.densDirty = true;
    const want = Math.round(q.revealed * q.mapOrder.length / q.rightTotal);
    while (q.mapRevealed < want) g.solid[q.mapOrder[q.mapRevealed++]] = 1;
    if (q.revealed >= q.rightTotal) q.done = true;
    this.showProgress();
  },
  /* A cluster has to be somewhere a body can actually get to. Most of the
     hand is its unlit interior, which the threshold never called ground, so a
     seed picked at random from the picture lands in open air as often as not
     and the game stalls waiting for a collection that cannot happen. Seed only
     from cells with solid map within a cell of them. */
  reachable(c){
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if (this.solidAt(c.x + dx, c.y + dy)) return true;
    return false;
  },
  spawnCluster(now){
    const q = this.quest;
    const live = q.left.filter(c => !c.gone);
    if (!live.length){ this.revealTo(q.rightTotal); return; }
    const pool = live.filter(c => this.reachable(c));
    if (!pool.length){ this.revealTo(q.rightTotal); return; }
    const seed = pool[(Math.random() * pool.length) | 0];
    /* A splatter, not a disc: one main blob and a handful of satellite
       droplets thrown around it, with per-cell jitter so the rim stays
       ragged. Every live cell scores by its distance to the nearest droplet
       (weighted by that droplet's size) and the q.size best win — the seed
       itself always scores zero, so the splatter is always touchable where
       it surfaced. */
    const R0 = Math.sqrt(q.size) * .55;
    const drops = [{x: seed.x, y: seed.y, w: 1}];
    const nd = 4 + ((Math.random() * 4) | 0);
    for (let i = 0; i < nd; i++){
      const a = Math.random() * Math.PI * 2, d = R0 * (.8 + Math.random() * 1.9);
      drops.push({x: seed.x + Math.cos(a) * d, y: seed.y + Math.sin(a) * d,
                  w: .3 + Math.random() * .45});
    }
    for (const c of live){
      let s = 1e9;
      for (const dr of drops){
        const v = Math.hypot(c.x - dr.x, c.y - dr.y) / dr.w;
        if (v < s) s = v;
      }
      c._cs = s * (.72 + Math.random() * .56);
    }
    live.sort((a, b) => a._cs - b._cs);
    const picked = live.slice(0, Math.min(q.size, live.length));
    const HUES = [RGBV.flare, RGBV.aqua, RGBV.gold, RGBV.violet];
    const col = HUES[q.hue++ % HUES.length];
    let r = 1;
    for (const c of picked){
      c.clus = col;
      r = Math.max(r, Math.hypot(c.x - seed.x, c.y - seed.y));
    }
    q.cl = {cells: picked, x: seed.x + .5, y: seed.y + .5, r, col, born: now};
  },
  collect(now){
    const q = this.quest, cl = q.cl, g = q.grid;
    for (const c of cl.cells){ c.gone = true; c.clus = null; }
    this.densDirty = true;
    q.taken += cl.cells.length;
    q.cl = null;
    const prev = q.revealed;
    this.revealTo(q.taken * q.ratio);
    /* The ledger is settled in the lines above — the vessels still sum, and
       the map under the new cells is real at once. Everything below is only
       light: the splatter tears apart where it was struck (its own cells and
       nothing else), and one mote per revealed cell stutters across the
       gutter and lands on the cell it became, which stays veiled until its
       mote arrives and then glitch-settles from the cluster's colour home. */
    const landed = q.right.slice(prev, q.revealed);
    let cx = 0, cy = 0;
    for (const c of cl.cells){ cx += c.x; cy += c.y; }
    cx /= cl.cells.length; cy /= cl.cells.length;
    const at = c => ({x: g.ox + c.x * g.p, y: g.oy + c.y * g.p});
    const thrown = c => {           /* where the burst throws this cell */
      const s = at(c);
      const dx = c.x - cx, dy = c.y - cy, d = Math.hypot(dx, dy) || 1;
      const th = (3 + Math.random() * 6) * g.p;
      return {x: s.x + (dx / d) * th,
              y: s.y + (dy / d) * th - g.p * (1 + Math.random() * 2)};
    };
    const fly = (c, t) => {
      t.veil = true;
      const s = at(c), b = thrown(c), e = at(t);
      this.fxq.push({kind:'fly', cell:t, col:cl.col,
        x0:s.x, y0:s.y, x1:b.x, y1:b.y, x3:e.x, y3:e.y,
        seed:Math.random() * 997, hops:9 + ((Math.random() * 7) | 0),
        t0:now + Math.random() * 350, dur:950 + Math.random() * 650});
    };
    for (let i = 0; i < cl.cells.length; i++){
      const c = cl.cells[i], t = landed[i];
      if (t) fly(c, t);
      else {                        /* spent, not carried: burst and gutter out */
        const s = at(c), b = thrown(c);
        this.fxq.push({kind:'burst', col:cl.col, x0:s.x, y0:s.y, x1:b.x, y1:b.y,
          seed:Math.random() * 997, t0:now, dur:420 + Math.random() * 380});
      }
    }
    for (let i = cl.cells.length; i < landed.length; i++)
      fly(cl.cells[i % cl.cells.length], landed[i]);
    q.next = now + 2200;
    try{ navigator.vibrate && navigator.vibrate(12); }catch(err){}
  },
  /* ── THE CHURN (4.0) ────────────────────────────────────────────────────
     The body is made of the picture it disturbs. While the wake is live, a
     disturbed diamond near the body and a sprite square on its trailing side
     trade places: the diamond rotates 45deg into a square as it flies to the
     slot, and the slot's old square detaches first, rotating back into a
     diamond as it settles onto the vacated cell. One cell lent per one slot
     holed, always paired, so the picture and the body both stay whole — the
     churn is an exchange, never a leak. Purely visual: collision reads the
     map and the ledger reads the vessels, and neither knows this exists. */
  cellPx(c){
    const g = this.grid;
    return {x: g.ox + c.x * g.p, y: g.oy + c.y * g.p};
  },
  slotPx(r, artC){
    const g = this.grid, p = this.p;
    const wPx = this.bw * g.p * 1.14, px = wPx / 12;
    const sx = g.ox - g.p / 2 + p.x * g.p, sy = g.oy - g.p / 2 + p.y * g.p;
    const sc = p.face < 0 ? 11 - artC : artC;
    return {x: sx - wPx / 2 + sc * px + px * .5,
            y: sy - (16 * px) / 2 + r * px + px * .5, half: px * .58};
  },
  spawnExchange(now){
    const g = this.grid, p = this.p;
    if (!g || !p) return;
    /* THE FLOW: the body advances through the ink like a magnet through
       filings. A diamond AHEAD of it is pulled in and absorbed at the front
       rim; at the same time a pixel of the BACK rim sheds, tumbles off, and
       settles onto the oldest cell the body still owes — which, because the
       debt queue is first-in-first-out, is a cell behind it on its own
       trail. Every lent cell is repaid by exactly one shed pixel and every
       shed slot regrows when its pixel lands, so body and picture both stay
       whole; only the matter flows through. */
    const face = p.face || 1;
    const near = [];
    for (let dy = -4; dy <= 4; dy++) for (let dx = -1; dx <= 5; dx++){
      const cx = Math.round(p.x - .5) + dx * face, cy = Math.round(p.y - .5) + dy;
      const c = this.cellAt.get(cy * this.cols + cx);
      if (c && !c.gone && !c.hidden && !c.veil && !c.lent && !c.clus)
        near.push(c);
    }
    if (!near.length) return;
    const cell = near[(Math.random() * near.length) | 0];
    /* rims of the current frame: the front half accretes, the back sheds */
    const map = PIX[this.frameName()];
    const solid = (rr, aa) => rr >= 0 && rr < 16 && aa >= 0 && aa < 12 &&
                              map[rr][aa] !== '.';
    const rimBack = [], rimFront = [];
    for (let r = 0; r < 16; r++) for (let a = 0; a < 12; a++){
      if (map[r][a] === '.' || this.holes.has(r * 12 + a)) continue;
      if (solid(r - 1, a) && solid(r + 1, a) &&
          solid(r, a - 1) && solid(r, a + 1)) continue;      /* interior */
      (a < 6 ? rimBack : rimFront).push(r * 12 + a);
    }
    const shedFrom = rimBack.length ? rimBack : rimFront;
    const joinAt   = rimFront.length ? rimFront : rimBack;
    if (!shedFrom.length || !joinAt.length) return;
    const sB = shedFrom[(Math.random() * shedFrom.length) | 0];
    const sF = joinAt[(Math.random() * joinAt.length) | 0];
    const rB = (sB / 12) | 0, aB = sB - rB * 12;
    const rF = (sF / 12) | 0, aF = sF - rF * 12;
    cell.lent = true;
    this.lentQ.push(cell);
    this.holes.add(sB);
    const owed = this.lentQ.shift();          /* the oldest debt, behind us */
    const live = g._live;
    const cellCol = cell.rgb2 || (live ? live.rgb : RGBV.bone);
    const owedCol = owed.rgb2 || (live ? live.rgb : RGBV.bone);
    const s0 = this.slotPx(rB, aB);
    this.exq.push({t:'out', cell: owed, r:rB, c:aB,
                   col0: SPAL[map[rB][aB]] || SPAL.r, col1: owedCol,
                   x0:s0.x, y0:s0.y, h0:s0.half,
                   t0:now, dur:340 + Math.random() * 200});
    this.exq.push({t:'in', cell, r:rF, c:aF,
                   col0: cellCol, col1: SPAL[map[rF][aF]] || SPAL.r,
                   t0:now + 60, dur:380 + Math.random() * 220});
  },
  stepChurn(P, now){
    const g = this.grid, list = this.exq;
    if (!g) return;
    if (this.p && this.wake.length && now >= this.exNext){
      this.spawnExchange(now);
      this.exNext = now + 40 + Math.random() * 70;
    }
    for (let i = list.length - 1; i >= 0; i--){
      const f = list[i];
      const k = (now - f.t0) / f.dur;
      if (k >= 1){
        if (f.t === 'out'){                  /* the slot regrows, the debt is
                                                repaid where it lands */
          this.holes.delete(f.r * 12 + f.c);
          f.cell.lent = false;
        }                                    /* 'in' is simply absorbed */
        list.splice(i, 1);
        continue;
      }
      const t = k <= 0 ? 0 : k * k * (3 - 2 * k);
      const cp = this.cellPx(f.cell);
      /* the cell's end of the swap wears the cell's own drawn size and
         opacity — read live, exactly as drawLive would paint it (breathing
         size, wake boost and all), because the lent cell keeps breathing:
         a departing diamond leaves at the size it was showing, and a
         landing square arrives at the size the cell will resume at. */
      const cd = f.cell.d;
      const cHalf = g.p * SZK * (cd ? cd.sz : 1);
      const cAl = Math.min(1, (cd ? cd.al : 1) + (f.cell.wk || 0) * .5);
      let x, y, frac, half, al;
      if (f.t === 'in'){                    /* cell -> body: a quarter-turn
                                               tumble, diamond through square
                                               back to diamond */
        const sp = this.slotPx(f.r, f.c);   /* tracks the moving body */
        x = cp.x + (sp.x - cp.x) * t; y = cp.y + (sp.y - cp.y) * t;
        frac = 1 + t * 2;
        half = cHalf + (sp.half - cHalf) * t;
        al = cAl + (1 - cAl) * t;
      } else {                              /* body -> cell: the same tumble,
                                               spun the other way */
        x = f.x0 + (cp.x - f.x0) * t; y = f.y0 + (cp.y - f.y0) * t;
        frac = 3 - t * 2;
        half = f.h0 + (cHalf - f.h0) * t;
        al = 1 + (cAl - 1) * t;
      }
      const col = [f.col0[0] + (f.col1[0] - f.col0[0]) * t,
                   f.col0[1] + (f.col1[1] - f.col0[1]) * t,
                   f.col0[2] + (f.col1[2] - f.col0[2]) * t];
      P.pushRot(x, y, half, frac, col, al);
    }
  },

  /* ── the motes: purely visual, and a glitch rather than a spell. Time is
     quantized into 70ms ticks and every choice — position hop, dropout,
     glyph, echo — keys off (seed, tick), so a mote holds, teleports and
     stutters instead of gliding. Nothing here eases. ─────────────────────── */
  stepFx(P, now){
    const list = this.fxq, g = this.grid;
    if (!list || !list.length || !g) return;
    const H = (a, b) => {
      const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
      return s - Math.floor(s);
    };
    for (let i = list.length - 1; i >= 0; i--){
      const f = list[i];
      const k = Math.max(0, (now - f.t0) / f.dur);
      if (k >= 1){
        if (f.kind === 'fly') f.cell.veil = false;   /* it lands, it is there */
        list.splice(i, 1);
        continue;
      }
      const tk = Math.max(0, Math.floor((now - f.t0) / 70));
      if (H(f.seed, tk * 1.7) < .14) continue;        /* dropout: gone this tick */
      if (f.kind === 'fly'){
        /* piecewise-linear through the burst point, sampled at whole hops:
           hold, teleport, hold. A mote still waiting on its stagger delay
           sits at home, already flickering. */
        const kq = Math.min(1, Math.floor(k * f.hops) / f.hops);
        const seg = kk => kk < .28
          ? {x: f.x0 + (f.x1 - f.x0) * (kk / .28),
             y: f.y0 + (f.y1 - f.y0) * (kk / .28)}
          : {x: f.x1 + (f.x3 - f.x1) * ((kk - .28) / .72),
             y: f.y1 + (f.y3 - f.y1) * ((kk - .28) / .72)};
        const p0 = seg(kq);
        const x = p0.x + (H(f.seed, tk) - .5) * g.p * 4 * (1 - k);   /* scanline shove */
        const y = p0.y + (H(f.seed + 3, tk) - .5) * g.p * 1.5 * (1 - k);
        const sz = .6 + ((H(f.seed + 7, tk) * 3) | 0) * .35;         /* snaps, no pulse */
        const gl = H(f.seed + 11, tk) > .82 ? GL_RING : GL_SQUARE;
        if (kq > 0){                                   /* ghost at the last hop */
          const p1 = seg(Math.max(0, kq - 1 / f.hops));
          P.push(p1.x, p1.y, g.p, sz * .8, GL_SQUARE, f.col, .25);
        }
        if (H(f.seed + 5, tk) > .8)                    /* a torn colour echo */
          P.push(x + g.p * 1.4, y, g.p, sz, gl, RGBV.aqua, .5);
        P.push(x, y, g.p, sz, gl, f.col, .95);
      } else if (k < .22){
        /* burst, first ticks: it does not move — it flickers in place,
           snapping between bone and the cluster colour, fat and thin */
        const inv = H(f.seed, tk) > .5;
        P.push(f.x0, f.y0, g.p, inv ? 1.4 : .7, GL_SQUARE,
               inv ? RGBV.bone : f.col, 1);
      } else {
        /* then it tears away in four hard steps and is gone */
        const kk = (k - .22) / .78;
        const kq = Math.floor(kk * 4) / 4;
        const x = f.x0 + (f.x1 - f.x0) * kq + (H(f.seed, tk) - .5) * g.p * 3;
        const y = f.y0 + (f.y1 - f.y0) * kq + (H(f.seed + 3, tk) - .5) * g.p;
        P.push(x, y, g.p, 1 - .4 * kk, GL_SQUARE, f.col, (1 - kq) * .95);
      }
    }
  },
  stepQuest(now){
    const q = this.quest, p = this.p;
    if (!q || !p || q.done) return;
    if (!q.cl){
      if (!q.next) q.next = now + 700;
      if (now >= q.next) this.spawnCluster(now);
      return;
    }
    /* A splatter has no useful radius, so you collect it by touching any of
       its cells, not by entering a circle around the seed. The seed test is
       kept as a cheap gate: no cell can be in reach while the seed is further
       away than the splatter's own extent plus that reach. */
    const reach = this.bw * .5 + 1.6;
    if (Math.hypot(p.x - q.cl.x, p.y - q.cl.y) < q.cl.r + reach){
      for (const c of q.cl.cells)
        if (Math.hypot(p.x - c.x - .5, p.y - c.y - .5) < reach){ this.collect(now); return; }
    }
    /* Reachable is not the same as reached — an isolated ledge can still hold
       one out of range. Rather than stall the whole game on it, a cluster that
       has gone uncollected for half a minute surfaces somewhere else. */
    if (now - q.cl.born > 30000){
      for (const c of q.cl.cells) c.clus = null;
      q.cl = null;
      q.next = now;
    }
  },
  showProgress(){
    const el = $('#prog');
    if (!el) return;
    const q = this.quest;
    if (!q){ el.textContent = ''; return; }
    const pct = Math.round(100 * q.revealed / q.rightTotal);
    el.innerHTML = q.done
      ? '<span class="hot">&#9670;</span> COMPLETE'
      : '<span class="hot">&#9670;</span> ' + pct + '%';
  },

  /* Re-measure the body from the current grain and SIZE. Separate from adopt()
     because the size slider must not rebuild the face: the lattice is
     unchanged, only the thing standing on it, so this is instant and the
     picture does not flicker through a merge every time the slider moves. */
  measure(){
    const grid = this.grid;
    if (!grid) return;
    this.bh = Math.max(3, grid.rows * BODY_FRAC * SIZE);
    /* An imported sheet dictates its own width. A 19x53 ranger inside the
       built-in 0.62 box would collide half a body away from anything it
       touched; a wide sprite in that box would sink into walls. */
    this.bw = this.bh * (SPRITE ? Math.max(.26, Math.min(1.1, SPRITE.aspect * 1.06)) : .62);
    const K = this.bh / REF_BODY;
    for (const k in PHYS0) this.phys[k] = PHYS0[k] * K;
  },
  /* Growing a body can bury it in the picture it was standing on. */
  resize(){
    this.measure();
    if (this.p) this.unstick(this.p);
  },
  unstick(p){
    if (!this.overlaps(p.x, p.y, this.bw, this.bh)) return;
    for (let i = 0; i < 48; i++){
      p.y -= .25;
      if (!this.overlaps(p.x, p.y, this.bw, this.bh)){ p.vy = 0; p.climbing = false; return; }
    }
    this.respawn();
  },
  /* STEP-UP is what makes a photograph runnable.

     A halftone of a face is not a level designed by anyone: its top surface
     rises and falls a cell at a time, and to a body that only slides, a
     one-cell bump is a wall. Without this the runner spawns on a cheekbone and
     spends the rest of its life pressed against the next one — which reads as
     broken controls, not as difficult terrain. So a grounded body that is
     blocked sideways may climb about a third of its own height to get past,
     the same allowance an arcade platformer gives a kerb. In the air it may
     not, or every ledge becomes a free grab. */
  moveAxis(p, dx, dy){
    const STEP = .25;
    const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / STEP));
    const sx = dx / steps, sy = dy / steps;
    const lift = this.bh * .34;
    for (let i = 0; i < steps; i++){
      if (sx){
        const nx = p.x + sx;
        if (this.overlaps(nx, p.y, this.bw, this.bh)){
          let stepped = false;
          if (p.onGround || p.coyote > 0){
            for (let up = .25; up <= lift; up += .25){
              if (!this.overlaps(nx, p.y - up, this.bw, this.bh)){
                p.y -= up; p.x = nx; stepped = true; break;
              }
            }
          }
          if (!stepped){ p.vx = 0; break; }
        } else p.x = nx;
      }
      if (sy){
        const ny = p.y + sy;
        if (this.overlaps(p.x, ny, this.bw, this.bh)){
          if (sy > 0){ p.onGround = true; p.coyote = COYOTE; }
          p.vy = 0; break;
        }
        p.y = ny;
      }
    }
  },
  step(dt){
    const p = this.p, PH = this.phys;
    if (!p || !this.solid) return;

    /* the halo breathes: ease toward the ink density under the body, and
       refresh the field when the quest has moved ink between the panels */
    this.featherK += (this.densAt(p.x, p.y) - this.featherK) * Math.min(1, dt * 6);
    if (this.densDirty && this.dens) this.buildDens(this.grid);

    const left  = keys.left, right = keys.right, up = keys.up, down = keys.down, jump = keys.jump;
    if (left || right || up || down || jump) this.idleSince = 0;

    /* climbing — hold up or down against any line */
    const wasClimbing = p.climbing;
    const near = this.onLine(p);
    if (!near) p.climbing = false;
    else if (up || (down && !p.onGround)) p.climbing = true;
    if (p.climbing && jump && !p.held){ p.climbing = false; p.vy = -PH.jump * .82; p.held = true; }

    const dir = (right ? 1 : 0) - (left ? 1 : 0);
    if (dir) p.face = dir;

    if (p.climbing){
      p.vy = (down ? PH.climb : 0) - (up ? PH.climb : 0);
      p.vx = dir * PH.climbSide;
      p.anim += (Math.abs(p.vy) + Math.abs(p.vx)) * dt / this.bh;
    } else {
      const a = p.onGround ? PH.accel : PH.airAccel;
      if (dir){
        p.vx += dir * a * dt;
        if (Math.abs(p.vx) > PH.maxRun) p.vx = PH.maxRun * Math.sign(p.vx);
      } else if (p.onGround){
        const drop = PH.friction * dt;
        p.vx = Math.abs(p.vx) <= drop ? 0 : p.vx - Math.sign(p.vx) * drop;
      }
      p.buffer = jump && !p.held ? BUFFER : Math.max(0, p.buffer - dt);
      if (p.buffer > 0 && p.coyote > 0){
        p.vy = -PH.jump; p.buffer = 0; p.coyote = 0; p.onGround = false;
      }
      if (!jump && p.vy < -PH.jumpCut) p.vy = -PH.jumpCut;
      p.vy = Math.min(PH.maxFall, p.vy + PH.gravity * dt);
      p.anim += Math.abs(p.vx) * dt / this.bh;
    }
    p.held = !!jump;

    p.onGround = false;
    if (p.climbing){
      /* A climber passes through the line it is holding. Every lit cell is
         solid, so collision would pin a body between two of them and the climb
         would go nowhere. Letting go puts collision back, and unstick() makes
         sure that never happens inside a wall. */
      p.x = Math.min(this.cols - .5, Math.max(.5, p.x + p.vx * dt));
      p.y = Math.min(this.rows + 4, Math.max(-4, p.y + p.vy * dt));
    } else {
      this.moveAxis(p, p.vx * dt, 0);
      this.moveAxis(p, 0, p.vy * dt);
    }
    if (wasClimbing && !p.climbing) this.unstick(p);
    if (!p.onGround) p.coyote = Math.max(0, p.coyote - dt);

    if (p.y > this.rows + 6 || p.x < -2 || p.x > this.cols + 2) this.respawn();
  },
  /* What the body is doing, in the five names both renderers answer to. */
  state(){
    const p = this.p;
    if (p.climbing) return 'climb';
    if (!p.onGround) return p.vy < 0 ? 'jump' : 'fall';
    return Math.abs(p.vx) < .3 ? 'idle' : 'run';
  },
  /* Cycles that carry the body along the ground are driven by DISTANCE, one
     cycle per two body-heights, so the feet do not skate however fast the
     runner is going or however coarse the grain is. Cycles that play in place
     are driven by the clock at the sheet's own fps. */
  frameOf(list, moving, now){
    if (!list || !list.length) return 0;
    if (list.length === 1) return list[0];
    const i = moving ? Math.floor(this.p.anim * list.length / 2)
                     : Math.floor(now * (SPRITE ? SPRITE.fps : 8) / 1000);
    return list[((i % list.length) + list.length) % list.length];
  },
  frameName(){                       /* the built-in maps, kept for the probe */
    const p = this.p, st = this.state();
    /* moving sideways keeps its lean even on a climb inside the picture —
       the flank-to-flank wobble is only for a straight vertical climb */
    if (st === 'climb' && Math.abs(p.vx) < this.phys.climbSide * .5)
      return (Math.floor(p.anim * 2.2) & 1) ? 'climb2' : 'climb1';
    if (st === 'jump' || st === 'fall' || st === 'idle') return st;
    const f = Math.floor(p.anim * 3.1) & 3;
    return ['run1', 'run2', 'run3', 'run2'][f];
  },
  /* Draw against the grid the MAP came from, never against whatever the
     painter is drawing this frame. A merge swaps the picture four seconds
     before the new map is adopted, and the two grids can differ in pitch and
     origin — mapping the runner's cell position through the incoming grid
     teleports it across the screen for the length of every merge. */
  draw(P, now){
    const p = this.p, grid = this.grid;
    if (!p || !grid) return;
    const sx = grid.ox - grid.p / 2 + p.x * grid.p;
    const sy = grid.oy - grid.p / 2 + p.y * grid.p;
    /* the art overhangs the hitbox a little, the way arcade sprites always did */
    /* smoothstep the eased density so the middle of the range stays quiet
       and the pad only steps aside where the ink is genuinely heavy */
    const hk = HALO ? Math.max(0, Math.min(1, this.featherK)) : 0;
    const fs = hk * hk * (3 - 2 * hk);
    if (SPRITE){
      const st = this.state();
      const fi = this.frameOf(SPRITE.anim[st], st === 'run' || st === 'climb', now);
      drawSheetFrame(P, fi, sx, sy, this.bh * grid.p * 1.06, p.face, 1, fs);
    } else {
      drawPixmap(P, PIX[this.frameName()], sx, sy, this.bw * grid.p * 1.14, p.face, 1, this.holes, fs);
    }
  },
  /* ?showmap=1 paints layer 1 under layer 2 — the only way to see why a
     runner is standing on nothing. The skin fades individual cells in and out
     on their own clocks while the map never moves, so "floating" is usually a
     solid cell whose diamond is mid-breath, and "falls through the picture" is
     a lit cell the threshold never called ground. Both look identical without
     this. */
  drawMap(P){
    const g = this.grid;
    if (!g || !this.solid) return;
    const half = g.p * .34;
    for (let y = 0; y < this.rows; y++) for (let x = 0; x < this.cols; x++)
      if (this.solid[y * this.cols + x])
        P.pushPx(g.ox + x * g.p, g.oy + y * g.p, half, GL_SQUARE, RGBV.aqua, .16);
  },
  frame(dt, now, P, grid){
    const q = this.quest;
    VIEW.tx = q && grid ? grid.w * .18 * (1 - 2 * q.revealed / q.rightTotal) : 0;
    VIEW.x += (VIEW.tx - VIEW.x) * Math.min(1, dt * 2.2);
    if (!this.solid && grid && grid.solid) this.adopt(grid);
    if (SHOWMAP) this.drawMap(P);
    this.step(dt);
    this.disturb(dt);
    this.stepQuest(now);
    this.stepFx(P, now);
    this.stepChurn(P, now);
    this.draw(P, now);
    this.idleSince += dt;
  },
};

/* ── input ───────────────────────────────────────────────────────────────── */
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  Space:'jump', KeyZ:'jump', KeyX:'jump',
};
addEventListener('keydown', e => {
  if (e.code === 'KeyR'){ game.respawn(); return; }
  if (e.code === 'KeyN'){ mergeNow(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  keys[k] = true;
  e.preventDefault();
}, {passive:false});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) keys[k] = false;
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* Touch: a virtual stick wherever the left half is first touched, and the
   whole right half is the jump button. No on-screen furniture — this is a
   wallpaper, and a d-pad drawn over the picture would be the loudest thing
   on the screen. */
const stick = {id:null, x0:0, y0:0};
const jumpTouch = {id:null};
const PADEL = $('#pad');
function padDown(e){
  const w = innerWidth;
  for (const t of e.changedTouches ? e.changedTouches : [e]){
    if (t.clientX < w * .5 && stick.id === null){
      stick.id = t.identifier === undefined ? 'm' : t.identifier;
      stick.x0 = t.clientX; stick.y0 = t.clientY;
    } else if (jumpTouch.id === null){
      jumpTouch.id = t.identifier === undefined ? 'm' : t.identifier;
      keys.jump = true;
    }
  }
  hideHint();
}
function padMove(e){
  for (const t of e.changedTouches ? e.changedTouches : [e]){
    const id = t.identifier === undefined ? 'm' : t.identifier;
    if (id !== stick.id) continue;
    const dx = t.clientX - stick.x0, dy = t.clientY - stick.y0;
    const D = 14;
    keys.left = dx < -D; keys.right = dx > D;
    keys.up = dy < -D; keys.down = dy > D;
  }
}
function padUp(e){
  for (const t of e.changedTouches ? e.changedTouches : [e]){
    const id = t.identifier === undefined ? 'm' : t.identifier;
    if (id === stick.id){
      stick.id = null;
      keys.left = keys.right = keys.up = keys.down = false;
    }
    if (id === jumpTouch.id){ jumpTouch.id = null; keys.jump = false; }
  }
}
PADEL.addEventListener('touchstart', e => { padDown(e); e.preventDefault(); }, {passive:false});
PADEL.addEventListener('touchmove',  e => { padMove(e); e.preventDefault(); }, {passive:false});
PADEL.addEventListener('touchend',   padUp);
PADEL.addEventListener('touchcancel', padUp);
PADEL.addEventListener('mousedown', padDown);
addEventListener('mousemove', padMove);
addEventListener('mouseup', padUp);

let hintT = setTimeout(() => hideHint(), 7000);
let hideHint = function(){ clearTimeout(hintT); const h = $('#hint'); if (h) h.classList.add('gone'); };

/* ── the route, when Memory Quest has one ──────────────────────────────────
   This page still runs on its own with the deck baked into it below — open
   it and nothing has changed. What is new is that it will take a deck from
   the town next door instead, when there is one to take.

   Memory Quest hands the route over in two halves, and it has to, because
   the two halves are needed at different moments. The ORDER is a list of
   marker ids in localStorage, which is synchronous — so PLACE.length, and
   with it how many faces there are, is known before anything is built. The
   PICTURES are in IndexedDB, which is not — so they are fetched once, into
   the same array, before loadFaces() is allowed to touch it. Every file://
   page here shares one origin, which is the whole reason either half is
   readable from this document at all.

   One picture per face: a locus is a place you stand in front of and look
   at, not half of a pair. */
const MQ_KEY = 'hq.deck';
function mqOrder(){
  try {
    const raw = JSON.parse(localStorage.getItem(MQ_KEY) || 'null');
    if (!raw || !Array.isArray(raw.uids) || !raw.uids.length) return null;
    return raw;
  } catch (e){ return null; }
}
function mqFetch(uids, into){
  return new Promise(res => {
    let db;
    const fail = () => res(false);
    const r = indexedDB.open('hq.loci', 1);
    r.onupgradeneeded = () => { try { r.result.createObjectStore('img'); } catch (e){} };
    r.onerror = fail;
    r.onsuccess = () => {
      db = r.result;
      if (!db.objectStoreNames.contains('img')) return fail();
      const t = db.transaction('img', 'readonly'), s = t.objectStore('img');
      let left = uids.length;
      uids.forEach((uid, k) => {
        const q = s.get(uid);
        q.onsuccess = () => { if (q.result) into[k] = q.result; if (!--left) res(true); };
        q.onerror  = () => { if (!--left) res(true); };
      });
    };
  });
}
const MQ = mqOrder();

/* PANELS is how many pictures share the screen at once, side by side, and the
   deck groups its images into scenes of that many. Two of them is a different
   thing from one: the lattice reads a scene as a single picture, so the map
   spans both and the gutter between them is a real gap in the world — you can
   fall down it. */
/* the route if there is one, and the page's own deck if there is not */
const PLACE = MQ ? MQ.uids.slice() : BAKED;
const PANELS_BUILT = MQ ? 1 : 2;      /* filled in by tools/build.py */
const PANELS = Math.max(1, Math.min(4,
  parseInt(QS.get('panels') || '', 10) || PANELS_BUILT || 1));
const NIMG = PLACE.length;
const N = Math.max(1, Math.ceil(NIMG / PANELS));
const PAL = [RGBV.bone, RGBV.flare, RGBV.aqua, RGBV.gold, RGBV.violet];
/* three inks rotate through the deck; the wrap never repeats a colour */
const autoInk = k => (k === N - 1 && N % PAL.length === 1) ? PAL[1] : PAL[k % PAL.length];

/* fixed look: max detail, no inversion, no edge tracing — tone, contrast, ink
   and the ground threshold stay tunable.
   ink -2 = FULL (per-diamond source colour) - -1 = auto rotation - 0+ = fixed */
const defTune = () => ({inv:0, bri:0, con:1, edge:0, ink:-2, map:2, thr:.55});
/* GRAIN is deliberately NOT in TUNE. Tone, contrast, ink and the ground
   threshold are properties of a photograph and belong to its face; how finely
   the lattice is resolved is a property of the screen you are looking at, and
   wanting one face coarse and the next fine is not a thing anyone wants. It is
   one number for the deck, and COPY SETTINGS exports it alongside the rest. */
const GRAIN_DEF = 240;      /* chosen on screen, 21 Aug 2026 */
let GRAIN = (function(){
  const v = parseInt(QS.get('grain') || '', 10);
  return v >= 40 && v <= 400 ? v : GRAIN_DEF;    // ?grain=<n>, for measuring
})();
/* per-face tuning — COPY SETTINGS exports this array; paste it over the line
   below (let TUNE = [...];) to bake a dialled-in look in permanently */
let TUNE = Array.from({length: N}, defTune);
const tuneKey = k => GRAIN + '|' + JSON.stringify(TUNE[k]);
const curOpts = k => {
  const t = TUNE[k];
  const full = t.ink === -2;
  return {rgb:(full ? RGBV.bone : (t.ink >= 0 ? PAL[t.ink] : autoInk(k))), fullColor:full,
          quantize: painterFor(CVS).kind !== 'webgl',
          cols:GRAIN, inv:t.inv, bri:t.bri, con:t.con, edge:t.edge,
          mapMode:t.map, mapThr:t.thr,
          fitY:FIT.y, fitH:FIT.h};
};

const st = {img:Array(NIMG).fill(null),          /* one entry per source image */
            src:Array(N).fill(null),            /* one composed scene per face */
            cur:-1, pre:Array(N).fill(null),
            bt:Array(N).fill(0), cancel:Array(N).fill(null)};
const FIT = {y:0, h:1};
const CVS = $('#cv');

/* Bake one source image and find where its content actually is.

   Every picture in this deck is a subject floating in a field of black, and
   the black is usually most of the file — the hand occupies a fifth of its
   frame. Fitting the whole frame into a panel would leave the subject a
   thumbnail in the middle of nothing, so the content box is measured once here
   and composeScene() fits THAT. A data: URI does not taint a canvas, which is
   the only reason the pixels can be read back at all. */
function bake(img){
  const m = 640;
  const sc = Math.min(1, m / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round((img.naturalWidth || 1) * sc));
  c.height = Math.max(1, Math.round((img.naturalHeight || 1) * sc));
  const cx = c.getContext('2d', {willReadFrequently:true});
  if (!cx) return null;
  cx.drawImage(img, 0, 0, c.width, c.height);
  const rec = {cv:c, x0:0, y0:0, x1:c.width, y1:c.height};
  try{
    const d = cx.getImageData(0, 0, c.width, c.height).data;
    let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++){
      const i = (y * c.width + x) * 4;
      const v = (d[i] * .2126 + d[i+1] * .7152 + d[i+2] * .0722) * (d[i+3] / 255);
      if (v <= 12) continue;
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    }
    if (x1 >= x0 && y1 >= y0){ rec.x0 = x0; rec.y0 = y0; rec.x1 = x1 + 1; rec.y1 = y1 + 1; }
  }catch(err){ /* keep the whole frame */ }
  return rec;
}

/* Lay a scene's images out across the canvas, left to right.

   Composed at the CANVAS's aspect rather than some fixed one, so the builder's
   own contain-fit is a no-op and the pictures fill the screen instead of
   letterboxing inside it. That means a resize has to recompose — see
   recompose() — because the shape of the frame is part of the picture now. */
const GUTTER = .88;             /* of each panel's width, so the two do not touch */
function composeScene(sIdx){
  const list = [];
  for (let i = 0; i < PANELS; i++){
    const k = sIdx * PANELS + i;
    if (k < NIMG && st.img[k]) list.push(st.img[k]);
  }
  if (!list.length) return null;
  const ar = (CVS.width || 16) / (CVS.height || 9);
  const H = 600, W = Math.max(64, Math.round(H * ar));
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const cx = c.getContext('2d');
  if (!cx) return null;
  cx.fillStyle = COL.ground;
  cx.fillRect(0, 0, W, H);
  const pw = W / list.length;
  list.forEach((im, i) => {
    const sw = im.x1 - im.x0, sh = im.y1 - im.y0;
    const sc = Math.min(pw * GUTTER / sw, H * .94 / sh);
    const dw = sw * sc, dh = sh * sc;
    cx.drawImage(im.cv, im.x0, im.y0, sw, sh,
                 i * pw + (pw - dw) / 2, (H - dh) / 2, dw, dh);
  });
  return c;
}
function recompose(){
  for (let s = 0; s < N; s++) st.src[s] = composeScene(s);
  st.pre = Array(N).fill(null);
}

const loadedCount = () => st.src.reduce((a, s) => a + (s ? 1 : 0), 0);
function nextIdx(k){              // next loaded face, skipping any that failed
  for (let i = 1; i <= N; i++){ const j = (k + i) % N; if (st.src[j]) return j; }
  return k;
}
function prevIdx(k){
  for (let i = 1; i <= N; i++){ const j = ((k - i) % N + N) % N; if (st.src[j]) return j; }
  return k;
}
function preValid(k){
  const p = st.pre[k];
  return p && p.src === st.src[k] && p.tk === tuneKey(k) &&
         p.grid.w === CVS.width && p.grid.h === CVS.height;
}
function evict(a, b){             // keep only current + next; big decks stay light
  for (let i = 0; i < N; i++){
    if (i === a || i === b) continue;
    st.pre[i] = null;
    if (st.cancel[i]){ st.cancel[i](); st.cancel[i] = null; }
  }
}
/* Start a build for face k, cancelling whatever was already building it.
   The builder runs in <=6ms slices off a timer, so an uncancelled one keeps
   spending its slice every tick forever. Dragging the grain slider queues a
   rebuild every few frames; without this they stack, each still taking its
   6ms, and the page grinds to a halt exactly when you are trying to judge how
   it looks. The token guard alone is not enough — it discards the *result*,
   not the work. */
function startBuild(k, cb){
  if (!st.src[k]) return;
  if (st.cancel[k]){ st.cancel[k](); st.cancel[k] = null; }
  const tok = ++st.bt[k];
  const tk = tuneKey(k);
  st.cancel[k] = imageGridAsync(CVS, st.src[k], curOpts(k), g => {
    st.cancel[k] = null;
    if (st.bt[k] !== tok) return;
    cb(g, tk);
  });
}
function schedulePre(k){          // quietly build the next face in <=6ms slices
  if (!st.src[k] || preValid(k)) return;
  startBuild(k, (g, tk) => {
    if (g && g.w === CVS.width && g.h === CVS.height)
      st.pre[k] = {grid:g, src:st.src[k], tk};
  });
}
function renderFace(k, dur){
  st.cur = k;
  syncPanel();
  const nx = nextIdx(k);
  if (preValid(k)){               // cache hit -> the merge starts instantly
    morphTo(CVS, st.pre[k].grid, dur);
    evict(k, nx);
    schedulePre(nx);
    return;
  }
  startBuild(k, (g, tk) => {
    if (st.cur !== k || !g) return;
    st.pre[k] = {grid:g, src:st.src[k], tk};
    morphTo(CVS, g, dur);
    evict(k, nx);
    schedulePre(nx);
  });
}

/* Auto-cycle: drift a while, then recrystallize into the next still — but
   never while somebody is playing. The picture is the floor now; pulling it
   out from under a running body every ten seconds is the difference between a
   wallpaper you can play on and one that keeps killing you. Six seconds of
   stillness and the deck resumes on its own. */
let autoT = 0, panelOpen = false;
const HOLD_AFTER_INPUT = 6;
const nextCycle = () => 9000 + Math.random() * 4000;
function scheduleAuto(){
  clearTimeout(autoT);
  if (panelOpen) return;          // hold the deck still while tuning
  autoT = setTimeout(() => {
    if (PLAY && game.idleSince < HOLD_AFTER_INPUT){ scheduleAuto(); return; }
    mergeNow();
  }, nextCycle());
}
function mergeNow(){
  if (loadedCount() > 1) renderFace(nextIdx(st.cur));
  scheduleAuto();
}

/* park the loop while the screen is elsewhere — kinder to the battery */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ stopScene(CVS); clearTimeout(autoT); }
  else {
    if (CVS._fx) runFx(CVS);
    if (loadedCount() > 1) scheduleAuto();
  }
});

/* resize / rotation */
let rT = null;
addEventListener('resize', () => {
  clearTimeout(rT);
  rT = setTimeout(() => {
    bgRender();
    recompose();
    if (st.cur >= 0 && st.src[st.cur]){
      const g = imageGrid(CVS, st.src[st.cur], curOpts(st.cur));
      if (g){ st.pre[st.cur] = {grid:g, src:st.src[st.cur], tk:tuneKey(st.cur)}; staticScene(CVS, g); }
      schedulePre(nextIdx(st.cur));
    } else staticScene(CVS, holderGrid(CVS));
  }, 160);
});

/* ── tune panel ──────────────────────────────────────────────────────────── */
const panel = $('#panel');
const S = {grain:$('#sGrain'), size:$('#sSize'), bri:$('#sBri'), con:$('#sCon'), thr:$('#sThr')};
const V = {grain:$('#vGrain'), size:$('#vSize'), bri:$('#vBri'), con:$('#vCon'), thr:$('#vThr')};
const CHIPS = Array.from(document.querySelectorAll('.chip2[data-ink]'));
const MCHIPS = Array.from(document.querySelectorAll('.chip2[data-map]'));

function syncPanel(){
  if (st.cur < 0) return;
  const t = TUNE[st.cur];
  $('#pface').textContent = 'FACE ' + (st.cur + 1) + '/' + N;
  S.grain.value = GRAIN;       V.grain.textContent = GRAIN;
  S.size.value = Math.round(SIZE * 100);
  V.size.textContent = Math.round(SIZE * 100) + '%';
  S.bri.value = t.bri * 100;   V.bri.textContent = (t.bri > 0 ? '+' : '') + Math.round(t.bri * 100);
  S.con.value = t.con * 100;   V.con.textContent = t.con.toFixed(1) + '×';
  S.thr.value = Math.round(t.thr * 100);
  V.thr.textContent = Math.round(t.thr * 100) + '%';
  CHIPS.forEach(c => c.classList.toggle('sel', +c.dataset.ink === t.ink));
  MCHIPS.forEach(c => c.classList.toggle('sel', +c.dataset.map === t.map));
}
let tuneT = 0;
function rebuildCur(instant){     // re-crystallize the current face with new settings
  clearTimeout(tuneT);
  tuneT = setTimeout(() => {
    const k = st.cur;
    if (k < 0 || !st.src[k]) return;
    st.pre[k] = null;
    startBuild(k, (g, tk) => {
      if (st.cur !== k || !g) return;
      st.pre[k] = {grid:g, src:st.src[k], tk};
      morphTo(CVS, g, 1400);
    });
  }, instant ? 0 : 220);
}
function onSlide(){
  if (st.cur < 0) return;
  const t = TUNE[st.cur];
  const before = tuneKey(st.cur);
  GRAIN = +S.grain.value;
  t.bri = S.bri.value / 100;
  t.con = S.con.value / 100;
  t.thr = S.thr.value / 100;
  SIZE = S.size.value / 100;
  syncPanel();
  if (PLAY) game.resize();
  /* Only the settings that go into a face rebuild trigger one. Size does not:
     it changes the character, not the picture, and rebuilding would put a
     1.4-second merge in the middle of a slider drag. */
  if (tuneKey(st.cur) !== before){
    st.pre = Array(N).fill(null);        // grain is global: every cache is stale
    rebuildCur();
  }
}
Object.values(S).forEach(s => s.addEventListener('input', onSlide));
CHIPS.forEach(c => c.onclick = () => {
  if (st.cur < 0) return;
  TUNE[st.cur].ink = +c.dataset.ink;
  syncPanel();
  rebuildCur(true);
});
MCHIPS.forEach(c => c.onclick = () => {
  if (st.cur < 0) return;
  TUNE[st.cur].map = +c.dataset.map;
  syncPanel();
  rebuildCur(true);
});
$('#preset').onclick = () => {
  if (st.cur < 0) return;
  TUNE[st.cur] = defTune();
  syncPanel();
  rebuildCur(true);
};
$('#pcopy').onclick = async () => {
  const s = 'let GRAIN = ' + GRAIN + ';\nlet SIZE = ' + SIZE.toFixed(2) +
            ';\nlet TUNE = ' + JSON.stringify(TUNE) + ';';
  const btn = $('#pcopy');
  try{
    await navigator.clipboard.writeText(s);
    btn.textContent = 'COPIED';
    setTimeout(() => { btn.textContent = 'COPY SETTINGS'; }, 1400);
  }catch(err){
    const ta = $('#pjson');
    ta.style.display = 'block'; ta.value = s; ta.focus(); ta.select();
  }
};
$('#pprev').onclick = () => { if (loadedCount()) renderFace(prevIdx(st.cur), 1400); };
$('#pnext').onclick = () => { if (loadedCount()) renderFace(nextIdx(st.cur), 1400); };
function setPanel(open){
  panelOpen = open;
  panel.hidden = !open;
  $('#tunetog').style.display = open ? 'none' : '';
  if (open){
    clearTimeout(autoT);
    syncPanel();
    const ph = panel.getBoundingClientRect().height;
    FIT.y = .02;                                   // ride high, clear of the sliders
    FIT.h = Math.max(.3, 1 - ph / window.innerHeight - .06);
  } else {
    $('#pjson').style.display = 'none';
    FIT.y = 0; FIT.h = 1;
  }
  st.pre = Array(N).fill(null);                    // fit changed -> caches are stale
  rebuildCur(true);
  if (!open) scheduleAuto();
}
$('#tunetog').onclick = () => setPanel(true);
$('#pclose').onclick = () => setPanel(false);

function loadFaces(){
  let pending = NIMG;
  const done = () => {
    if (--pending !== 0) return;
    recompose();
    const first = st.src.findIndex(Boolean);
    if (first >= 0){ renderFace(first); scheduleAuto(); }
  };
  PLACE.forEach((uri, k) => {
    const img = new Image();
    img.onload = () => { st.img[k] = bake(img); done(); };
    img.onerror = done;
    img.src = uri;
  });
}

/* ── ?fps=1 · the readout that answers "is it actually fast" ──────────────
   Frame rate and instance count, on screen, in the browser you are asking
   about. It has to live here rather than in the test harness because the test
   harness has no WebGL2: it can only ever report the fallback's numbers, which
   are the numbers this whole rewrite exists to stop paying. */
if (QS.get('fps') === '1'){
  const box = $('#hint');
  FXPROF.on = true;
  let frames = 0, t0 = performance.now();
  let renderer = '';
  const tick = () => {
    frames++;
    const now = performance.now();
    if (now - t0 >= 500){
      const P = painterFor(CVS);
      if (!renderer){
        if (P.gl){
          const ext = P.gl.getExtension('WEBGL_debug_renderer_info');
          renderer = ext ? String(P.gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)).slice(0, 34)
                         : String(P.gl.getParameter(P.gl.RENDERER)).slice(0, 34);
        } else renderer = 'cpu';
      }
      const fps = frames * 1000 / (now - t0);
      const jsms = FXPROF.n ? FXPROF.ms / FXPROF.n : 0;
      frames = 0; t0 = now; FXPROF.ms = 0; FXPROF.n = 0;
      box.classList.remove('gone');
      box.style.color = '#FF5FA2';
      box.textContent = fps.toFixed(0) + ' fps | js ' + jsms.toFixed(1) + ' ms | ' +
        P.kind + ' | ' + P.count() + ' inst | ' + CVS.width + 'x' + CVS.height + ' px | ' + renderer;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  hideHint = () => {};
}

/* ── probe + still, for the screenshot harness ───────────────────────────── */
if (QS.get('probe') === '1'){
  window.LR = {
    game, st, PIX,
    painter: () => painterFor(CVS).kind,
    instances: () => painterFor(CVS).count(),
    solidCount: () => (game.grid ? game.grid.solidCount : 0),
    density: () => (game.grid ? game.grid.solidCount / (game.cols * game.rows) : 0),
    mapThr: () => (game.grid ? game.grid.mapThr : 0),
    grain: () => GRAIN,
    panels: () => PANELS,
    quest(){
      const q = game.quest;
      return q && {taken:q.taken, revealed:q.revealed, rightTotal:q.rightTotal,
                   leftTotal:q.leftTotal, size:q.size, done:q.done,
                   cluster: q.cl && {x:q.cl.x, y:q.cl.y, r:q.cl.r, n:q.cl.cells.length},
                   hiddenRight: q.right.filter(c => c.hidden).length,
                   goneLeft: q.left.filter(c => c.gone).length};
    },
    revealAll(){ if (game.quest) game.revealTo(game.quest.rightTotal); },
    /* grid.solidCount is the count at BUILD time and never moves; the right
       panel's map is gated afterwards, so anything watching it grow has to
       count the array as it stands. */
    solidNow(half){
      const g = game;
      if (!g.solid) return 0;
      const x0 = half === 'right' ? Math.ceil(g.cols / PANELS) : 0;
      const x1 = half === 'left' ? Math.ceil(g.cols / PANELS) : g.cols;
      let n = 0;
      for (let y = 0; y < g.rows; y++) for (let x = x0; x < x1; x++)
        if (g.solid[y * g.cols + x]) n++;
      return n;
    },
    /* decay the wake without stepping physics, so a test can watch it settle
       without the body falling somewhere and stirring it up again */
    settleWake(secs){
      if (game.p){ game.p.vx = 0; game.p.vy = 0; }
      for (let i = 0; i < Math.round(secs * 60); i++) game.disturb(1 / 60);
      return game.wake.length;
    },
    /* put the body on the cluster and let the normal collection run */
    grabCluster(){
      const q = game.quest;
      if (!q || !q.cl) return false;
      game.p.x = q.cl.x; game.p.y = q.cl.y; game.p.vx = 0; game.p.vy = 0;
      game.stepQuest(performance.now());
      return true;
    },
    wake: () => game.wake.length,
    fx: () => ({n: game.fxq.length,
                fly: game.fxq.filter(f => f.kind === 'fly').length,
                veiled: game.quest ? game.quest.right.filter(c => c.veil).length : 0}),
    /* land every mote at once, exactly as stepFx would at k>=1 */
    settleFx(){
      for (const f of game.fxq) if (f.kind === 'fly') f.cell.veil = false;
      game.fxq.length = 0;
      return game.quest ? game.quest.right.filter(c => c.veil).length : 0;
    },
    view: () => ({x: VIEW.x, tx: VIEW.tx}),
    churn: () => ({holes: game.holes.size, ex: game.exq.length,
                   lent: game.grid && game.grid._live
                     ? game.grid._live.cells.filter(c => c.lent).length : 0}),
    forceExchange(){
      game.spawnExchange(performance.now());
      return {holes: game.holes.size, ex: game.exq.length};
    },
    /* complete every swap at once, exactly as stepChurn would at k>=1 */
    settleChurn(){
      for (const f of game.exq){
        if (f.t === 'out'){ game.holes.delete(f.r * 12 + f.c); f.cell.lent = false; }
      }
      for (const c of game.lentQ) c.lent = false;
      game.lentQ.length = 0;
      game.exq.length = 0;
      return {holes: game.holes.size,
              lent: game.grid._live.cells.filter(c => c.lent).length};
    },
    scenes: () => N,
    /* widest all-empty column run that is not the margin either side */
    gutter(){
      const g = game, runs = [];
      let run = 0;
      for (let x = 0; x < g.cols; x++){
        let any = false;
        for (let y = 0; y < g.rows; y++) if (g.solidAt(x, y)){ any = true; break; }
        if (any){ if (run) runs.push(run); run = 0; } else run++;
      }
      if (run) runs.push(run);
      const inner = runs.slice(1, -1);
      return inner.length ? Math.max.apply(null, inner) : 0;
    },
    size: () => SIZE,
    setSize(n){ SIZE = n; game.resize(); syncPanel(); },
    sheet: () => SPRITE && {w:SPRITE.w, h:SPRITE.h, frames:SPRITE.frames.length,
                            colours:SPRITE.pal.length, mirror:SPRITE.mirror,
                            anim:SPRITE.anim},
    state: () => game.state(),
    setGrain(n){ GRAIN = n; st.pre = Array(N).fill(null); rebuildCur(true); },
    cells: () => (game.grid && game.grid._live ? game.grid._live.cells.length : 0),
    body: () => ({w:game.bw, h:game.bh, cols:game.cols, rows:game.rows}),
    player: () => game.p && {x:game.p.x, y:game.p.y, onGround:game.p.onGround,
                             climbing:game.p.climbing, frame:game.frameName()},
    /* tick the fixed step directly, without the clock */
    sim(secs, k){
      for (const q in keys) keys[q] = false;
      if (k) for (const q of k.split('+')) keys[q] = true;
      const dt = 1 / 60;
      /* disturb() too, so a test exercises the same per-frame path the page
         does — the wake is not visible to anything that only steps physics */
      for (let i = 0; i < Math.round(secs * 60); i++){ game.step(dt); game.disturb(dt); }
      for (const q in keys) keys[q] = false;
      return this.player();
    },
  };
}
const STILL = parseInt(QS.get('still') || '0', 10);
if (STILL > 0) setTimeout(() => stopScene(CVS), STILL);

/* boot */
bgRender();
requestAnimationFrame(() => {
  staticScene(CVS, holderGrid(CVS));
  /* the pictures have to be in PLACE before loadFaces() reads it — the order
     was enough to size everything, but not to draw anything */
  if (MQ) mqFetch(MQ.uids, PLACE).then(loadFaces); else loadFaces();
});
</script>
</body>
</html>
