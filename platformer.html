<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080B">
<title>HALFTONE PLATFORMER</title>
<!--
  HALFTONE PLATFORMER — the diamond-halftone wallpaper, with somebody living in it.

  This is the phone wallpaper (docs/original-wallpaper.html) with two things
  changed and nothing else taken away: the deck still merges between faces, the
  lattice still breathes, the tune panel still tunes.

    1  THE PAINTER IS THE GPU NOW.  Every diamond in a frame is the same shape
       at a different position, size, colour and alpha — which is one instanced
       draw call, not seven thousand drawImage calls. The old path cost ~110% of
       a core for 2.2M pixels at 15fps on this machine because WebKit rasterizes
       2D canvas on the CPU; the same scene as instanced SDF diamonds ran 6.9M
       pixels at 60fps for ~13%. That measurement is why the character is
       affordable at all. The 2D path is kept, unchanged, as a fallback for a
       machine with no WebGL2 — and it is the path any offscreen QtWebEngine
       screenshot will take, because that harness has no WebGL2 at all.

    2  THREE LAYERS, AND ONLY ONE OF THEM IS SOLID.

         MAP      the picture thresholded to a static Uint8Array. The only
                  thing collision ever reads.
         SKIN     the shimmering halftone you actually see. Pure looks. Its
                  cells fade in and out on their own clocks — which is exactly
                  why collision must never read it, or the floor would blink
                  out from under a running body several times a second.
         SPRITE   the runner, drawn as hard squares in the same draw call as
                  the diamonds, so it is one buffer upload and one dispatch for
                  the whole frame.

  The glyphs are signed distance fields, not font glyphs: |x|+|y| is exactly a
  diamond, so a fill and a hollow come out crisp at any size with no atlas to
  bake, and a third glyph gives the sprite layer its hard pixel edges.

  GLSL ES rejects a non-ASCII character anywhere in the source, comments
  included — a diamond drawn in a shader comment fails the compile, the painter
  throws, and a canvas that has handed out a webgl2 context will not hand out a
  2d one. The screen goes black in a browser while a headless capture looks
  perfect. Keep the shader source ASCII.

    ?still=<ms>   run for N ms then hold one frame (screenshots)
    ?probe=1      expose window.LR for assertions
    ?nogame=1     the wallpaper alone, no runner
    ?grain=<n>    start at n columns of lattice (40-400, default 240)
    ?rim=1        a bone silhouette rim behind an imported sprite
    ?halo=0       the pad stays at full weight everywhere instead of
                  retiring where the picture's ink is dense
    ?size=<n>     character size, as a percentage (40-260, default 150)
    ?panels=<n>   pictures on screen at once, side by side (overrides the deck)
-->
<style>
:root{--ground:#08080B;--bone:#EDEAE3;--dim:#5A5A66;--flare:#FF5FA2;--aqua:#79E0D8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--ground);overflow:hidden;touch-action:none;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0;pointer-events:none}
#cv{z-index:1;pointer-events:none}
#pad{position:fixed;inset:0;z-index:2;touch-action:none}
.glass{background:rgba(8,8,11,.78);border:1px solid rgba(237,234,227,.35);
  backdrop-filter:blur(14px) saturate(1.05);-webkit-backdrop-filter:blur(14px) saturate(1.05)}
#tunetog{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;
  padding:10px 12px;font:400 9.5px/1 var(--mono);letter-spacing:.26em;color:var(--dim);
  text-transform:uppercase;cursor:pointer}
#tunetog .red{color:var(--flare)}
#hint{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top));z-index:4;
  text-align:center;font:400 9px/1.6 var(--mono);letter-spacing:.22em;color:var(--dim);
  text-transform:uppercase;pointer-events:none;transition:opacity 1.2s ease}
#hint.gone{opacity:0}
#prog{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:3;text-align:center;font:400 11px/1 var(--mono);letter-spacing:.3em;
  color:var(--bone);pointer-events:none;font-variant-numeric:tabular-nums}
#prog .hot{color:var(--flare)}
#panel{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;
  max-width:416px;margin:0 auto;padding:14px 14px 12px;display:flex;flex-direction:column;gap:9px;
  font:400 10px/1.5 var(--mono);letter-spacing:.18em;color:var(--bone);text-transform:uppercase}
#panel[hidden]{display:none}
.prow{display:flex;align-items:center;gap:10px}
.prow label{width:72px;flex:none;color:var(--dim);font-size:9px;letter-spacing:.22em}
.prow input[type=range]{flex:1;accent-color:var(--flare);height:24px;background:transparent}
.prow .pv{width:46px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:10px}
.phead{justify-content:space-between;letter-spacing:.24em}
.phead .who{color:var(--flare)}
.pbtn{padding:8px 10px;border:1px solid rgba(237,234,227,.35);cursor:pointer;background:none;
  color:var(--bone);font:400 9px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase}
.pbtn:active{background:var(--bone);color:var(--ground)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chip2{padding:9px 0;text-align:center;border:1px solid rgba(237,234,227,.35);cursor:pointer;
  font-size:9px;letter-spacing:.2em}
.chip2.sel{background:var(--bone);color:var(--ground)}
.pfoot{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
#pjson{width:100%;height:60px;display:none;background:#0D0D12;color:var(--bone);
  border:1px solid rgba(237,234,227,.35);font:9px/1.4 var(--mono);padding:6px}
</style>
</head>
<body>

<div id="hint">&larr; &rarr; run &middot; space jump &middot; &uarr; &darr; climb &middot; N next face &middot; R respawn</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const QS = new URLSearchParams(location.search);
const COL = {ground:'#08080B',bone:'#EDEAE3',dim:'#5A5A66',rule:'#1D1D26',flare:'#FF5FA2',aqua:'#79E0D8'};
const RGBV = {bone:[237,234,227], flare:[255,95,162], aqua:[121,224,216],
              gold:[242,193,78], violet:[167,139,250], ground:[8,8,11]};
const MONO = 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const PLAY = QS.get('nogame') !== '1';
const SHOWMAP = QS.get('showmap') === '1';

/* glyph ids, shared by both painters and the shader */
const GL_RING = 0, GL_FILL = 1, GL_SQUARE = 2;

/* THE PAN: a single horizontal camera offset, added at the painters' doors so
   everything drawn — lattice, runner, motes, map debug — moves as one scene.
   The game aims it from transfer progress: at 0% the scene sits shifted right
   so the source picture is nearer centre screen, and every collection eases
   it left until at 100% the finished picture is the centred one. Physics and
   input live in cell space and never see it. */
const VIEW = {x: 0, tx: 0};

/* ── canvas / grid shell ─────────────────────────────────────────────────── */
/* ?dpr=<n> overrides the backing-store ratio. Two uses: measuring whether a
   slow frame is the draw path or the sheer number of pixels being composited,
   and turning a 4K panel down to something an integrated GPU can fill. A host
   that reports an integer buffer scale for a fractionally-scaled output can
   pass the real one through here too. */
const DPR_FIX = (function(){ const v = parseFloat(QS.get('dpr') || ''); return v > 0 && v <= 4 ? v : 0; })();
function sizeCanvas(cv){
  const d = DPR_FIX || Math.min(window.devicePixelRatio || 1, 3);
  const r = cv.getBoundingClientRect();
  const w = Math.min(4096, Math.max(2, Math.round(r.width * d))),
        h = Math.min(4096, Math.max(2, Math.round(r.height * d)));
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  return d;
}
function gridShell(cv, targetCols){
  sizeCanvas(cv);
  if (cv.width < 10) return null;
  const p = Math.max(3, Math.round(cv.width / targetCols));
  const cols = Math.floor(cv.width / p), rows = Math.floor(cv.height / p);
  return {p, cols, rows,
    ox: Math.floor((cv.width - cols * p) / 2) + p / 2,
    oy: Math.floor((cv.height - rows * p) / 2) + p / 2,
    w: cv.width, h: cv.height, cells: [], solid: null};
}
/* soften the silhouette: every cell drifts a touch, a few drift a lot */
function roughen(g){
  for (const c of g.cells){
    const k = Math.random() < .14 ? 1.1 : .3;
    c.jx = (Math.random() - .5) * g.p * k;
    c.jy = (Math.random() - .5) * g.p * k;
  }
  return g;
}
const cellAl = c => c.al !== undefined ? c.al : (c.g === 1 ? .84 : 1);
const rgbStr = v => 'rgb(' + v[0] + ',' + v[1] + ',' + v[2] + ')';

/* ── THE PAINTER ─────────────────────────────────────────────────────────────
   One interface, two backends. `push` speaks the lattice's language (cell
   pitch and a size multiplier); `pushPx` speaks in raw half-extents, which is
   what the sprite layer wants. Both end up in the same instance buffer, so a
   frame of seven thousand diamonds and a hundred and forty sprite pixels is
   one upload and one dispatch.                                              */
const SZK = .45;      // half-extent of a diamond, as a fraction of cell pitch
const RING = .76;     // inner edge of the hollow diamond

/* Trig lookup. The per-cell breathing wobble wants sin and cos for every
   diamond every frame — a million-plus transcendentals a second at 4K. A
   4096-entry table is indistinguishable at this amplitude (the wobble is a
   tenth of a cell) and roughly an order of magnitude cheaper. */
const TRIG_N = 4096, TRIG_MASK = TRIG_N - 1, TRIG_K = TRIG_N / (Math.PI * 2);
const SIN_T = new Float32Array(TRIG_N), COS_T = new Float32Array(TRIG_N);
for (let i = 0; i < TRIG_N; i++){
  const a = i * (Math.PI * 2) / TRIG_N;
  SIN_T[i] = Math.sin(a); COS_T[i] = Math.cos(a);
}
const fsin = x => SIN_T[(x * TRIG_K) & TRIG_MASK];
const fcos = x => COS_T[(x * TRIG_K) & TRIG_MASK];

function glPainter(cv, gl){
  const VS = ['#version 300 es',
    'layout(location=0) in vec2 corner;',
    'layout(location=1) in vec4 inst;',   // x, y, half-extent, glyph
    'layout(location=2) in vec4 tint;',   // r, g, b, a  (0..1)
    'uniform vec2 res;',
    'out vec2 uv; out vec4 vcol; out float vglyph;',
    'void main(){',
    '  uv = corner; vcol = tint; vglyph = inst.w;',
    '  vec2 p = inst.xy + corner * inst.z;',
    '  vec2 ndc = (p / res) * 2.0 - 1.0;',
    '  gl_Position = vec4(ndc.x, -ndc.y, 0.0, 1.0);',
    '}'].join('\n');
  /* glyph 0 hollow diamond, 1 filled diamond, 2 square, 3+f a square
     rotated by f*45deg, folded mod 90deg (4.0's churn) — at f=1 its vertices
     are the diamond's, and f running 1..3 is a quarter-turn tumble from
     diamond through square back to diamond. Scaled by 1/(cos+sin) so the
     corners never leave the quad.
     The square is the sprite layer: hard edges, no antialiasing, so pixel art
     reads as pixel art sitting on top of a halftone. */
  const FS = ['#version 300 es',
    'precision mediump float;',
    'in vec2 uv; in vec4 vcol; in float vglyph;',
    'out vec4 frag;',
    'void main(){',
    '  float a;',
    '  if (vglyph > 2.5){',
    '    float ang = mod((vglyph - 3.0) * 0.7853982, 1.5707963);',
    '    float cs = cos(ang), sn = sin(ang);',
    '    vec2 r = vec2(cs * uv.x + sn * uv.y, cs * uv.y - sn * uv.x);',
    '    float d = max(abs(r.x), abs(r.y)) * (cs + sn);',
    '    float w = max(fwidth(d), 0.0001) * 1.05;',
    '    a = smoothstep(1.0, 1.0 - w, d);',
    '  } else if (vglyph > 1.5){',
    '    a = 1.0;',
    '  } else {',
    '    float d = abs(uv.x) + abs(uv.y);',
    '    float w = max(fwidth(d), 0.0001) * 1.05;',
    '    a = smoothstep(1.0, 1.0 - w, d);',
    '    if (vglyph < 0.5) a *= smoothstep(' + RING + ' - w, ' + RING + ', d);',
    '  }',
    '  a *= vcol.a;',
    '  if (a < 0.004) discard;',
    '  frag = vec4(vcol.rgb * a, a);',      // premultiplied
    '}'].join('\n');
  const mk = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, mk(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const uRes = gl.getUniformLocation(prog, 'res');

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const qb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  let cap = 8192;
  let data = new Float32Array(cap * 8);
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ib);
  gl.bufferData(gl.ARRAY_BUFFER, data.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0);  gl.vertexAttribDivisor(1, 1);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16); gl.vertexAttribDivisor(2, 1);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   // source is premultiplied
  gl.clearColor(0, 0, 0, 0);                      // the ambient ground shows through

  let n = 0;
  function grow(){
    cap *= 2;
    const bigger = new Float32Array(cap * 8);
    bigger.set(data);
    data = bigger;
    gl.bindBuffer(gl.ARRAY_BUFFER, ib);
    gl.bufferData(gl.ARRAY_BUFFER, data.byteLength, gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0);
    gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16);
  }
  return {
    kind: 'webgl',
    gl,
    begin(){
      n = 0;
      gl.viewport(0, 0, cv.width, cv.height);
      gl.uniform2f(uRes, cv.width, cv.height);
      gl.clear(gl.COLOR_BUFFER_BIT);
    },
    pushPx(x, y, half, glyph, rgb, alpha){
      if (alpha <= .004) return;
      if (n >= cap) grow();
      const o = n * 8;
      data[o]     = x + VIEW.x;
      data[o + 1] = y;
      data[o + 2] = half;
      data[o + 3] = glyph;
      data[o + 4] = rgb[0] / 255;
      data[o + 5] = rgb[1] / 255;
      data[o + 6] = rgb[2] / 255;
      data[o + 7] = alpha > 1 ? 1 : alpha;
      n++;
    },
    push(x, y, p, sz, glyph, rgb, alpha){
      this.pushPx(x, y, p * SZK * (sz || 1), glyph === GL_FILL ? GL_FILL : GL_RING, rgb, alpha);
    },
    pushRot(x, y, half, frac, rgb, alpha){
      this.pushPx(x, y, half, 3 + Math.max(0, Math.min(3, frac)), rgb, alpha);
    },
    end(){
      if (!n) return;
      gl.bindVertexArray(vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, ib);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, data, 0, n * 8);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
    },
    count(){ return n; }
  };
}

/* The 2D fallback, kept whole from the phone build. It is what runs on a
   machine with no WebGL2 — and it is what every offscreen QtWebEngine capture
   renders, because that harness has no WebGL2 either. A screenshot therefore
   proves the geometry and the game, never the shader. */
const SPRITES = new Map();
const SPCAP = 4200;
function sprite(p, glyph, rgb, sz){
  const szq = Math.max(.4, Math.min(1.6, Math.round((sz || 1) * 4) / 4));
  const q = ((rgb[0] >> 4) << 8) | ((rgb[1] >> 4) << 4) | (rgb[2] >> 4);
  const k = p + '|' + glyph + '|' + q + '|' + szq;
  let s = SPRITES.get(k);
  if (!s){
    if (SPRITES.size > SPCAP){            // drop the oldest quarter, never wipe the lot
      let drop = SPRITES.size >> 2;
      for (const k2 of SPRITES.keys()){ SPRITES.delete(k2); if (--drop <= 0) break; }
    }
    const fs = Math.max(2, Math.round(p * 1.5 * szq));
    const box = Math.ceil(fs * 1.35) + 2;
    s = document.createElement('canvas');
    s.width = s.height = box;
    const c = s.getContext('2d');
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = fs + 'px ' + MONO;
    c.fillStyle = rgbStr(rgb);
    c.fillText(glyph === GL_FILL ? '◆' : '◇', box / 2, box / 2);
    SPRITES.set(k, s);
  }
  return s;
}
function d2Painter(cv){
  const ctx = cv.getContext('2d');
  let n = 0;
  return {
    kind: 'canvas2d',
    begin(){ n = 0; if (ctx){ ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, cv.width, cv.height); } },
    pushPx(x, y, half, glyph, rgb, alpha){
      if (!ctx || alpha <= .004) return;
      n++;
      ctx.globalAlpha = alpha > 1 ? 1 : alpha;
      ctx.fillStyle = rgbStr(rgb);
      ctx.fillRect(Math.round(x + VIEW.x - half), Math.round(y - half),
                   Math.max(1, Math.ceil(half * 2)), Math.max(1, Math.ceil(half * 2)));
    },
    push(x, y, p, sz, glyph, rgb, alpha){
      if (!ctx || alpha <= .004) return;
      const spr = sprite(p, glyph, rgb, sz);
      ctx.globalAlpha = alpha > 1 ? 1 : alpha;
      ctx.drawImage(spr, x + VIEW.x - spr.width / 2, y - spr.height / 2);
      n++;
    },
    pushRot(x, y, half, frac, rgb, alpha){
      if (!ctx || alpha <= .004) return;
      const a = (Math.max(0, Math.min(3, frac)) * Math.PI / 4) % (Math.PI / 2);
      const h = half / (Math.cos(a) + Math.sin(a));
      ctx.save();
      ctx.translate(x + VIEW.x, y); ctx.rotate(a);
      ctx.globalAlpha = alpha > 1 ? 1 : alpha;
      ctx.fillStyle = rgbStr(rgb);
      ctx.fillRect(-h, -h, h * 2, h * 2);
      ctx.restore();
      n++;
    },
    end(){ if (ctx) ctx.globalAlpha = 1; },
    count(){ return n; }
  };
}
/* WebKit hands the GL context back to the system when a surface has been
   covered long enough. Nothing in the page notices by itself: every draw call
   quietly does nothing and the screen stays black. Take the loss, use a restore
   if one arrives, reload if none does. */
function hookContextLoss(cv){
  if (cv._lossHooked) return;
  cv._lossHooked = true;
  let reloadT = null;
  cv.addEventListener('webglcontextlost', ev => {
    ev.preventDefault();
    cv._paint = null;
    clearTimeout(reloadT);
    reloadT = setTimeout(() => location.reload(), 4000);
  });
  cv.addEventListener('webglcontextrestored', () => {
    clearTimeout(reloadT); reloadT = null;
    cv._paint = null;
    if (st.cur >= 0) renderFace(st.cur, 900);
  });
}
function painterFor(cv){
  if (cv._paint && !(cv._paint.gl && cv._paint.gl.isContextLost())) return cv._paint;
  cv._paint = null;
  let gl = null;
  try{
    gl = cv.getContext('webgl2', {alpha:true, antialias:false, depth:false, stencil:false,
                                  premultipliedAlpha:true, powerPreference:'low-power'});
  }catch(err){ gl = null; }
  if (gl){
    hookContextLoss(cv);
    try{ return (cv._paint = glPainter(cv, gl)); }
    catch(err){ console.log('halftone: webgl setup failed, falling back -', err.message); }
  }
  return (cv._paint = d2Painter(cv));
}

/* ── the lattice, painted ────────────────────────────────────────────────── */
function paintGridInto(P, grid){
  for (const c of grid.cells)
    P.push(grid.ox + c.x * grid.p + (c.jx || 0),
           grid.oy + c.y * grid.p + (c.jy || 0),
           grid.p, c.sz || 1, c.g, c.rgb, cellAl(c));
}
function stopScene(cv){
  const fx = cv._fx;
  if (fx && fx.raf){ cancelAnimationFrame(fx.raf); fx.raf = 0; }
}
function cellPx(grid, c){
  return {
    px: grid.ox + c.x * grid.p + (c.jx || 0),
    py: grid.oy + c.y * grid.p + (c.jy || 0),
    g: c.g, rgb: c.rgb, al: cellAl(c), sz: c.sz || 1, lc: c.lc || null
  };
}
function livePixels(grid){ return grid.cells.map(c => cellPx(grid, c)); }

/* easing menu — arrivals shimmer with soft springs */
const EASE = {
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  quint: t => 1 - Math.pow(1 - t, 5),
  soft: t => 1 - Math.exp(-6 * t) * Math.cos(5.2 * t),
  backSoft: t => { const c1 = .9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
};

/* stray field: loose diamonds outside the figure, each with its own
   drift speed, heading, wobble and twinkle */
function spawnStrays(grid){
  const n = Math.max(50, Math.min(150, Math.round(grid.cells.length * .06)));
  const solid = new Set();
  for (const c of grid.cells) solid.add(c.x + '_' + c.y);
  const out = [];
  for (let i = 0; i < n; i++){
    let px = 0, py = 0, tries = 0;
    do{
      px = grid.p + Math.random() * (grid.w - 2 * grid.p);
      py = grid.p + Math.random() * (grid.h - 2 * grid.p);
      tries++;
    } while (tries < 6 &&
      solid.has(Math.round((px - grid.ox) / grid.p) + '_' + Math.round((py - grid.oy) / grid.p)));
    const seedCell = grid.cells[(Math.random() * grid.cells.length) | 0];
    out.push({
      px, py,
      g: Math.random() < .3 ? 1 : 2,
      rgb: seedCell ? seedCell.rgb : RGBV.bone,
      al: .08 + Math.random() * .18,
      sp: grid.p * (.3 + Math.random() * .9),
      an: Math.random() * 6.28318,
      wb: (Math.random() - .5) * .8,
      wbT: (Math.random() - .5) * .8,
      ph: Math.random() * 6.28318,
      sz: .5 + Math.random() * .45
    });
  }
  return out;
}
function drawStray(P, p, s, now){
  const tw = .8 + .25 * fsin(now * .0014 + s.ph * 1.7);
  P.push(s.px, s.py, p, s.sz, s.g, s.rgb, Math.max(0, Math.min(1, s.al * tw)));
}
function driftStrays(list, dt, now, g, warm){
  const pad = g.p * 1.5;
  for (const s of list){
    s.wb += (s.wbT - s.wb) * Math.min(1, dt * 1.6);
    if (Math.random() < dt * .3) s.wbT = (Math.random() - .5) * .9;
    s.an += s.wb * dt;
    const sp = s.sp * warm * (1 + .18 * fsin(now * .0011 + s.ph));
    s.px += fcos(s.an) * sp * dt;
    s.py += fsin(s.an) * sp * dt;
    if (s.px < -pad) s.px = g.w + pad; else if (s.px > g.w + pad) s.px = -pad;
    if (s.py < -pad) s.py = g.h + pad; else if (s.py > g.h + pad) s.py = -pad;
  }
}

/* ── the living lattice: each diamond re-rolls its mode on its own clock ─── */
function stepLive(L, now){
  const tide = .5 + .5 * fsin(now * .0004 + L.phase);   // airy -> dense breath
  for (const c of L.cells){
    if (c.gone || c.hidden) continue;      /* spent, or not delivered yet */
    if (!c.tr && now >= c.next){
      const t = Math.random() < tide ? 1 : 0;
      const m = L.poolM[(Math.random() * L.poolM.length) | 0];
      const vv = c.vars[t * L.nm + m] || c.vars[(1 - t) * L.nm + m];
      const tgt = vv ? vv : {g:c.d.g, al:0, sz:.35, jx:c.d.jx, jy:c.d.jy};
      c.tr = {f:{g:c.d.g, al:c.d.al, sz:c.d.sz, jx:c.d.jx, jy:c.d.jy}, t:tgt,
              t0:now, dur:600 + Math.random() * 900};
    }
    if (c.tr){
      const k = Math.min(1, (now - c.tr.t0) / c.tr.dur);
      const ea = EASE.io(k), es = EASE.soft(k);
      const f = c.tr.f, t = c.tr.t;
      c.d.al = f.al + (t.al - f.al) * ea;
      c.d.sz = f.sz + (t.sz - f.sz) * es;
      c.d.jx = f.jx + (t.jx - f.jx) * es;
      c.d.jy = f.jy + (t.jy - f.jy) * es;
      c.d.g  = k < .5 ? f.g : t.g;
      if (k >= 1){ c.tr = null; c.next = now + 1200 + Math.random() * 5200; }
    }
  }
}
function drawLive(P, grid, L, now){
  stepLive(L, now);
  const p = grid.p;
  for (const c of L.cells){
    if (c.gone || c.hidden || c.veil || c.lent || c.d.al <= .02) continue;
    const bx = fsin(now * .0016 + c.x * 1.7 + c.y * 2.3) * p * .09 + (c.wx || 0);
    const by = fcos(now * .0013 + c.x * 2.1 + c.y * 1.3) * p * .09 + (c.wy || 0);
    let rgb = c.rgb2 || L.rgb, al = c.d.al, sz = c.d.sz;
    if (c.clus){                       /* a cluster waiting to be carried over */
      rgb = c.clus;
      const pulse = .78 + .22 * fsin(now * .005 + c.x * .7 + c.y * .9);
      al = Math.min(1, (al + .45) * pulse);
      sz = sz * 1.15;
    } else if (c.wk){                  /* disturbed by something moving through */
      al = Math.min(1, al + c.wk * .5);
    }
    P.push(grid.ox + c.x * p + c.d.jx + bx, grid.oy + c.y * p + c.d.jy + by,
           p, sz, c.d.g, rgb, Math.min(1, al));
  }
}
function snapLive(fx){
  const grid = fx.grid, out = [];
  for (const c of fx.live.cells){
    if (c.gone || c.hidden || c.veil || c.lent || c.d.al <= .04) continue;
    out.push({px:grid.ox + c.x * grid.p + c.d.jx, py:grid.oy + c.y * grid.p + c.d.jy,
              g:c.d.g, rgb:c.rgb2 || fx.live.rgb, al:c.d.al, sz:c.d.sz, lc:c});
  }
  return out;
}

/* ── one loop per canvas ─────────────────────────────────────────────────────
   Runs the morph, settles into idle drift, steps the game, and closes the
   painter once. Next frame is scheduled BEFORE drawing and the draw is guarded,
   so a throw can never freeze the page.                                     */
const FXPROF = {on:false, ms:0, n:0};
function fxStep(cv, now){
  const fx = cv._fx;
  if (!fx) return;
  fx.raf = requestAnimationFrame(n => fxStep(cv, n));
  let P = null;
  const t_js = FXPROF.on ? performance.now() : 0;
  try{
    P = painterFor(cv);
    const dt = Math.min(.05, (now - (fx.lt || now)) / 1000);
    fx.lt = now;
    P.begin();
    const flying = fx.morph ? paintMorph(fx, P, now, dt) : false;
    if (!flying) paintIdle(fx, P, now, dt);
    if (PLAY) game.frame(dt, now, P, fx.grid);
    P.end();
    fx.err = 0;
    if (FXPROF.on){ FXPROF.ms += performance.now() - t_js; FXPROF.n++; }
  }catch(err){
    fx.err = (fx.err || 0) + 1;
    if (fx.err > 90){
      stopScene(cv);
      fx.morph = null;
      console.log('halftone: draw loop gave up -', err.message);
    }
  }
}
/* returns true while the wave is still in the air */
function paintMorph(fx, P, now, dt){
  const m = fx.morph;
  let t = (now - m.t0) / m.dur;
  /* master envelope: brisk launch, long gravity settle — the tail of every
     flight plays out in slow motion instead of cutting off at speed */
  if (t < 1) t = 1 - Math.pow(1 - t, 1.65);
  if (t >= 1){
    fx.morph = null;
    fx.strays = m.strayTargets;
    fx.live = fx.grid._live || null;
    fx.idle0 = m.t0;
    if (PLAY) game.adopt(fx.grid);        // the picture has landed: it is ground now
    return false;
  }
  if (m.newLive) stepLive(m.newLive, now);
  if (m.oldLive && m.oldLive !== m.newLive) stepLive(m.oldLive, now);
  const grid = fx.grid, pad = grid.p * 1.5, W = grid.w, H = grid.h;
  driftStrays(m.strayTargets, dt, now, grid, Math.min(1, (now - m.t0) / 900));
  for (const q of m.parts){
    if (t < q.dl){
      if (q.olc){          // still standing in the departing face: keep churning
        q.x0 = grid.ox + q.olc.x * grid.p + q.olc.d.jx;
        q.y0 = grid.oy + q.olc.y * grid.p + q.olc.d.jy;
        q.g0 = q.olc.d.g; q.a0 = q.olc.d.al; q.s0 = q.olc.d.sz;
      } else if (q.dr){
        q.dr.an += q.dr.wb * dt;
        q.x0 += fcos(q.dr.an) * q.dr.sp * dt;
        q.y0 += fsin(q.dr.an) * q.dr.sp * dt;
        if (q.x0 < -pad) q.x0 = W + pad; else if (q.x0 > W + pad) q.x0 = -pad;
        if (q.y0 < -pad) q.y0 = H + pad; else if (q.y0 > H + pad) q.y0 = -pad;
      }
    }
    /* live endpoints: the destination keeps churning / drifting mid-flight */
    let x1 = q.x1, y1 = q.y1, g1 = q.g1, a1 = q.a1, s1 = q.s1;
    if (q.lc){ const D = q.lc.d; x1 = q.tx + D.jx; y1 = q.ty + D.jy; g1 = D.g; a1 = D.al; s1 = D.sz; }
    else if (q.st){ x1 = q.st.px; y1 = q.st.py; }
    const e = q.ez(Math.min(1, Math.max(0, (t - q.dl) / q.sn)));
    const lx = q.x0 + (x1 - q.x0) * e, ly = q.y0 + (y1 - q.y0) * e;
    const bow = q.bw * Math.sin(Math.PI * Math.min(1, Math.max(0, e)));
    const px = lx + q.nx * bow + fsin(now * .0016 + q.ph) * grid.p * q.wa;
    const py = ly + q.ny * bow + fcos(now * .0013 + q.ph * 1.4) * grid.p * q.wa;
    const rgb = q.crgb;   // mutate in place — zero allocations per frame
    rgb[0] = Math.max(0, Math.min(255, (q.r0[0] + (q.r1[0] - q.r0[0]) * e) | 0));
    rgb[1] = Math.max(0, Math.min(255, (q.r0[1] + (q.r1[1] - q.r0[1]) * e) | 0));
    rgb[2] = Math.max(0, Math.min(255, (q.r0[2] + (q.r1[2] - q.r0[2]) * e) | 0));
    const al = Math.max(0, Math.min(1, q.a0 + (a1 - q.a0) * e));
    const sz = q.s0 + (s1 - q.s0) * e;
    P.push(px, py, grid.p, sz, e < .5 ? q.g0 : g1, rgb, al);
    q.cx = px; q.cy = py; q.cg = e < .5 ? q.g0 : g1; q.cal = al; q.cs = sz;
  }
  return true;
}
function paintIdle(fx, P, now, dt){
  if (!fx.live) fx.live = fx.grid._live || null;
  if (!fx.strays) fx.strays = spawnStrays(fx.grid);
  if (!fx.idle0) fx.idle0 = now;
  if (fx.live) drawLive(P, fx.grid, fx.live, now);
  else paintGridInto(P, fx.grid);
  driftStrays(fx.strays, dt, now, fx.grid, Math.min(1, (now - fx.idle0) / 900));
  for (const s of fx.strays) drawStray(P, fx.grid.p, s, now);
}
function runFx(cv){
  stopScene(cv);
  cv._fx.lt = 0;
  cv._fx.raf = requestAnimationFrame(n => fxStep(cv, n));
}
function staticScene(cv, grid){
  if (!grid) return;
  stopScene(cv);
  cv._fx = {grid, strays:spawnStrays(grid), live:grid._live || null, morph:null, raf:0, lt:0};
  if (PLAY) game.adopt(grid);
  runFx(cv);
}

/* ── the merge, unchanged in shape ────────────────────────────────────────────
   1 PRECURSORS  a few outside dots lead, already tinted to the NEXT face
   2 MAIN        the figure flows in behind them
   3 FILL        surplus diamonds shed off to become tomorrow's drifters
   4 SCATTER     the remaining outside dots trail in last, onto fine
                 random cells spread all over the figure                     */
function morphTo(cv, grid, dur){
  if (!grid) return;
  if (grid._live){          // cached grids: restart every diamond's clock
    const nn = performance.now();
    for (const c of grid._live.cells){ c.tr = null; c.next = nn + 500 + Math.random() * 6000; }
  }
  if (RM){ staticScene(cv, grid); return; }
  dur = dur || 4200;
  const old = cv._fx;
  let srcShape = null, srcOut = [];
  if (old && old.morph){
    srcShape = [];
    for (const q of old.morph.parts){
      const rec = {px:q.cx, py:q.cy, g:q.cg, rgb:q.crgb, al:q.cal, sz:q.cs, lc:q.lc || null};
      (q.role === 'fill' ? srcOut : srcShape).push(rec);
    }
  } else if (old && old.grid && old.grid.w === grid.w && old.grid.h === grid.h){
    srcShape = (old.live && old.live.cells) ? snapLive(old) : livePixels(old.grid);
    srcOut = (old.strays || []).map(s => ({px:s.px, py:s.py, g:s.g, rgb:s.rgb, al:s.al, sz:s.sz}));
  }
  if (srcShape && !srcShape.length) srcShape = null;
  stopScene(cv);
  const strayT = spawnStrays(grid);
  const KX = grid.w / 2, KY = grid.h / 2;
  const mkDr = () => ({sp:grid.p * (.3 + Math.random() * .9), an:Math.random() * 6.28318, wb:(Math.random() - .5) * .8});
  /* per-diamond damped spring: random pass count AND random damping, so no two
     flights settle alike; cos hits zero at t=1 so all still land exactly on cell */
  const mkSpring = () => {
    const r = Math.random();
    const n = r < .55 ? 0 : (r < .85 ? 1 : 2);          // 1 / 2 / 3 passes
    const w = (n + 1.5) * Math.PI;
    const a = [1.35, 1.8, 2.4][n] + Math.random() * 1.1; // random overshoot depth
    return t2 => 1 - Math.exp(-a * t2) * Math.cos(w * t2);
  };
  const ringPt = proto => {
    const an = Math.random() * 6.28318, R = Math.min(KX, KY) * .92;
    return {px:KX + Math.cos(an) * R, py:KY + Math.sin(an) * R, g:proto.g, rgb:proto.rgb, al:0, sz:.4};
  };
  const mk = (a, b, o) => {
    const dx = b.px - a.px, dy = b.py - a.py;
    const d = Math.hypot(dx, dy);
    return {
      x0:a.px, y0:a.py, x1:b.px, y1:b.py,
      g0:a.g, g1:b.g, a0:a.al, a1:b.al, r0:a.rgb, r1:b.rgb,
      s0:a.sz || 1, s1:b.sz || 1,
      lc:b.lc || null, olc:a.lc || null, st:null,
      tx:b.lc ? grid.ox + b.lc.x * grid.p : b.px,
      ty:b.lc ? grid.oy + b.lc.y * grid.p : b.py,
      dl:o.dl, sn:Math.max(.06, Math.min(o.sn, 1 - o.dl - .002)),
      ez:o.ez || EASE.io,
      nx:d > 1 ? -dy / d : 0, ny:d > 1 ? dx / d : 0,
      bw:(Math.random() - .5) * d * (o.bowK || 0),
      ph:Math.random() * 6.28318,
      wa:.05 + Math.random() * .09,
      role:o.role, dr:o.dr || null,
      cx:a.px, cy:a.py, cg:a.g, crgb:[a.rgb[0], a.rgb[1], a.rgb[2]], cal:a.al, cs:a.sz || 1
    };
  };
  const parts = [];

  if (!srcShape){
    for (const b of livePixels(grid))
      parts.push(mk(ringPt(b), b, {dl:Math.random() * .28, sn:.34 + Math.random() * .3, ez:Math.random() < .78 ? mkSpring() : EASE.soft, bowK:.18, role:'main'}));
    for (const s of strayT)
      parts.push(mk(ringPt(s), s, {dl:.2 + Math.random() * .3, sn:.32 + Math.random() * .3, ez:Math.random() < .5 ? mkSpring() : EASE.out, bowK:.5, role:'fill'}));
  } else {
    const cells = grid.cells;
    const K = Math.max(1, srcOut.length);
    const pk = Math.min(K, Math.max(8, Math.round(K * .35)));
    const TG = Math.max(24, Math.min(100, Math.round(cells.length * .07)));
    const used = new Uint8Array(cells.length);
    const pickIdx = n => {
      const out = [];
      let guard = 0;
      while (out.length < n && guard++ < n * 40){
        const i = (Math.random() * cells.length) | 0;
        if (!used[i]){ used[i] = 1; out.push(i); }
      }
      return out;
    };
    const stragIdx = pickIdx(TG);
    const preIdx = pickIdx(pk);
    const pool = shuffle(srcOut.slice());
    const preSrc = pool.slice(0, Math.min(pk, pool.length));
    const stragSrc = pool.slice(preSrc.length);
    const EZM = [EASE.io, EASE.io, EASE.io, EASE.soft, EASE.soft, EASE.backSoft];
    const EZS = [EASE.soft, EASE.soft, EASE.backSoft, EASE.out];

    /* 1 — precursors lead the wave, already wearing the next face */
    preIdx.forEach((ci, i) => {
      const b = cellPx(grid, cells[ci]);
      const a = preSrc.length ? preSrc[i % preSrc.length] : ringPt(b);
      parts.push(mk(a, b, {dl:Math.random() * .06, sn:.28 + Math.random() * .12, ez:mkSpring(), bowK:.28, role:'pre', dr:mkDr()}));
    });
    /* 2 — main body flows in behind them */
    const mainCells = [];
    for (let i = 0; i < cells.length; i++) if (!used[i]) mainCells.push(cells[i]);
    const srt = arr => {
      for (const q of arr){
        const dx = q.px - KX, dy = q.py - KY;
        q._a = Math.atan2(dy, dx); q._r = dx * dx + dy * dy;
      }
      arr.sort((u, v) => (u._a - v._a) || (u._r - v._r));
      return arr;
    };
    const A = srt(srcShape), B = srt(mainCells.map(c => cellPx(grid, c)));
    /* spares picked at random so excess evaporates evenly — never a wedge */
    let Asrc = A;
    const spare = [];
    if (A.length > B.length){
      const excess = A.length - B.length;
      const take = new Uint8Array(A.length);
      let picked = 0, guard = 0;
      while (picked < excess && guard++ < excess * 40){
        const i = (Math.random() * A.length) | 0;
        if (!take[i]){ take[i] = 1; picked++; }
      }
      Asrc = [];
      for (let i = 0; i < A.length; i++) (take[i] ? spare : Asrc).push(A[i]);
    }
    for (let i = 0; i < B.length; i++)
      parts.push(mk(Asrc[i % Asrc.length], B[i], {dl:.04 + Math.random() * .3, sn:.3 + Math.random() * .3, ez:Math.random() < .82 ? mkSpring() : EZM[(Math.random() * EZM.length) | 0], bowK:.2, role:'main'}));
    /* 3 — surplus sheds off into the new drifter posts */
    const fillSrc = spare.length ? spare : (pool.length ? pool : null);
    strayT.forEach((s, i) => {
      const a = fillSrc ? fillSrc[i % fillSrc.length] : ringPt(s);
      const q = mk(a, s, {dl:.15 + Math.random() * .20, sn:.32 + Math.random() * .15, ez:Math.random() < .5 ? mkSpring() : EASE.out, bowK:.4, role:'fill',
                          dr:fillSrc === pool ? mkDr() : null});
      q.st = s;
      parts.push(q);
    });
    /* 4 — the scattered dots trail in last, one continuous stream */
    stragIdx.forEach((ci, i) => {
      const b = cellPx(grid, cells[ci]);
      const a = stragSrc.length ? stragSrc[i % stragSrc.length] : ringPt(b);
      parts.push(mk(a, b, {dl:.3 + Math.random() * .34, sn:.3 + Math.random() * .18, ez:Math.random() < .8 ? mkSpring() : EZS[(Math.random() * EZS.length) | 0], bowK:.15, role:'strag', dr:mkDr()}));
    });
  }
  cv._fx = {grid,
            morph:{parts, t0:performance.now(), dur, strayTargets:strayT, lt:0,
                   newLive:grid._live || null,
                   oldLive:(old && old.morph ? old.morph.newLive : (old ? old.live : null)) || null},
            strays:null, raf:0, lt:0};
  runFx(cv);
}
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.random() * (i + 1) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── photo -> lattice: auto-levels, Bayer-dithered tone, Sobel edges ─────── */
const MASKCV = document.createElement('canvas');   // reused — never reallocated
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
/* what one cell looks like under each mode — null means "not in this mode" */
function modeCell(style, v, mag, th, inkFn){
  if (style === 'toon'){
    if (mag > .28) return {g:2, al:inkFn(Math.min(1, .6 + mag * .4)), sz:Math.min(1.4, 1 + mag * .25)};
    if (v > .6 + th * .08) return {g:1, al:inkFn(.8), sz:1.05};
    if (v > .3 + th * .08) return {g:1, al:inkFn(.6), sz:.55};
    return null;
  }
  if (style === 'line'){
    if (mag > .3) return {g:2, al:inkFn(Math.min(1, .45 + mag * .5)), sz:Math.min(1.45, .7 + mag * .5)};
    if (v > .8 + th * .15) return {g:1, al:inkFn(Math.min(.9, .3 + v * .5)), sz:.5};
    return null;
  }
  if (style === 'duo'){
    if (mag > .85) return {g:2, al:inkFn(1), sz:1.3};
    if (v > .62) return {g:1, al:inkFn(.84), sz:1.15};
    if (v > .34) return {g:2, al:inkFn(.55), sz:.8};
    return null;
  }
  if (style === 'shade'){
    if (mag > .7) return {g:2, al:inkFn(.9), sz:1.15};
    const b = Math.floor(v * 5 + (th - .5) * .9);   // dithered 5-band ladder
    if (b >= 4) return {g:1, al:inkFn(.95), sz:1.32};
    if (b === 3) return {g:1, al:inkFn(.84), sz:1.08};
    if (b === 2) return {g:1, al:inkFn(.68), sz:.85};
    if (b === 1) return {g:1, al:inkFn(.5), sz:.6};
    return v > .06 ? {g:2, al:inkFn(.28), sz:.45} : null;
  }
  if (style === 'glow'){                            // near-continuous dynamic range
    if (mag > .9) return {g:2, al:inkFn(1), sz:1.2};
    return v > .05 ? {g:1, al:inkFn(.14 + v * .8), sz:.5 + v * .95} : null;
  }
  if (mag > .6) return {g:2, al:inkFn(Math.min(1, .55 + mag * .4)), sz:Math.min(1.3, .9 + mag * .3)};
  if (v > th * .55 + .04) return {g:1, al:inkFn(.5 + v * .42), sz:.4 + v * 1.1};
  return null;
}
/* Palette-quantize a face so the 2D fallback's sprite cache has a bounded key
   space. The WebGL painter takes exact colours and never calls this. */
function quantizePalette(union, d, cols, K){
  const bins = new Map();
  for (const c of union){
    const i = (c.y * cols + c.x) * 4;
    let r = d[i], g2 = d[i + 1], b = d[i + 2];
    const mx = Math.max(r, g2, b);
    if (mx > 0){
      const s = Math.min(255 / mx, 1.28);
      r = Math.min(255, (r * s) | 0); g2 = Math.min(255, (g2 * s) | 0); b = Math.min(255, (b * s) | 0);
    }
    c._pr = r; c._pg = g2; c._pb = b;
    const key = ((r >> 3) << 10) | ((g2 >> 3) << 5) | (b >> 3);
    let e = bins.get(key);
    if (!e){ e = [0, 0, 0, 0]; bins.set(key, e); }
    e[0] += r; e[1] += g2; e[2] += b; e[3]++;
  }
  const top = Array.from(bins.values())
    .sort((a, b2) => b2[3] - a[3]).slice(0, K)
    .map(e => [Math.round(e[0] / e[3]), Math.round(e[1] / e[3]), Math.round(e[2] / e[3])]);
  if (!top.length) top.push(RGBV.bone.slice());
  for (const c of union){
    let best = 0, bd = Infinity;
    for (let i = 0; i < top.length; i++){
      const t = top[i];
      const dr = c._pr - t[0], dg = c._pg - t[1], db = c._pb - t[2];
      const dd = dr * dr + dg * dg + db * db;
      if (dd < bd){ bd = dd; best = i; }
    }
    c.rgb2 = top[best];
  }
}

/* face analysis as a resumable builder — run whole (sync) or in <=6ms slices
   (async) so a build never freezes the animation */
function makeBuilder(cv, srcCv, opts){
  const gc = Math.max(40, Math.min(400, Math.round(opts.cols || 120)));
  /* the cap follows the grain rather than the screen: a face keeps the same
     density of drawn cells whatever it is being drawn on */
  const GR = {cols: gc, cap: Math.min(40000, Math.round(gc * 71))};
  const g = gridShell(cv, GR.cols);
  if (!g || !srcCv) return null;
  const MODES = ['photo', 'shade', 'glow', 'toon', 'line', 'duo'];
  const NM = MODES.length;
  const GAM = [1.7, .75];                     // airy - dense
  const inkFn = a => a;
  const jit = () => (Math.random() - .5) * g.p * (Math.random() < .14 ? 1.1 : .3);
  const cur = {phase:0, t:0, row:0};
  let d = null, n = 0, raw = null, lo = 0, rng = 1;
  const tones = [null, null];
  const union = [];
  let mag2 = null;                            // Sobel magnitude, kept for the map
  let out = null, dead = false;

  function raster(){
    MASKCV.width = g.cols; MASKCV.height = g.rows;
    const o = MASKCV.getContext('2d', {willReadFrequently:true});
    if (!o){ dead = true; return; }
    /* fit inside a vertical band — lets the art ride above the tune panel */
    const availR = g.rows * (opts.fitH === undefined ? 1 : opts.fitH);
    const sc = Math.min(g.cols / srcCv.width, availR / srcCv.height);
    const dw = srcCv.width * sc, dh = srcCv.height * sc;
    o.drawImage(srcCv, (g.cols - dw) / 2, g.rows * (opts.fitY || 0) + (availR - dh) / 2, dw, dh);
    d = o.getImageData(0, 0, g.cols, g.rows).data;
    n = g.cols * g.rows;
    raw = new Float32Array(n);
    mag2 = new Float32Array(n);
    const vals = [];
    for (let i = 0; i < n; i++){
      if (d[i * 4 + 3] < 16){ raw[i] = -1; continue; }
      let v = (d[i * 4] * .2126 + d[i * 4 + 1] * .7152 + d[i * 4 + 2] * .0722) / 255;
      if (opts.inv) v = v + opts.inv * (1 - 2 * v);
      raw[i] = v; vals.push(v);
    }
    if (!vals.length){ dead = true; return; }
    vals.sort((a, b) => a - b);
    lo = vals[Math.floor(vals.length * .04)];
    rng = Math.max(.05, vals[Math.floor(vals.length * .96)] - lo);
    for (let t = 0; t < 2; t++){
      const varr = new Float32Array(n);
      for (let i = 0; i < n; i++){
        if (raw[i] < 0){ varr[i] = -1; continue; }
        let b2 = Math.min(1, Math.max(0, (raw[i] - lo) / rng));
        b2 = Math.min(1, Math.max(0, (b2 - .5) * (opts.con || 1) + .5 + (opts.bri || 0)));
        varr[i] = Math.pow(b2, GAM[t]);
      }
      const va = (x, y) => (x < 0 || y < 0 || x >= g.cols || y >= g.rows) ? 0 : Math.max(0, varr[y * g.cols + x]);
      tones[t] = {varr, va, sharp:new Float32Array(n)};
    }
  }
  function sharpRows(){
    const T = tones[cur.t], va = T.va, varr = T.varr, sharp = T.sharp;
    const y1 = Math.min(g.rows, cur.row + 26);
    for (let y = cur.row; y < y1; y++) for (let x = 0; x < g.cols; x++){
      const i = y * g.cols + x;
      if (varr[i] < 0){ sharp[i] = -1; continue; }
      const bl = (va(x-1,y-1)+va(x,y-1)+va(x+1,y-1)+va(x-1,y)+va(x,y)+va(x+1,y)+va(x-1,y+1)+va(x,y+1)+va(x+1,y+1)) / 9;
      sharp[i] = Math.min(1, Math.max(0, varr[i] + .55 * (varr[i] - bl)));
    }
    cur.row = y1;
    return y1 >= g.rows;
  }
  function localPass(){
    const sharp = tones[cur.t].sharp;
    const R2 = 4;
    const tmpV = new Float32Array(n), tmpC = new Float32Array(n);
    for (let y = 0; y < g.rows; y++){
      let sv = 0, sc2 = 0;
      for (let x = -R2; x < g.cols; x++){
        const xa = x + R2, xb = x - R2 - 1;
        if (xa < g.cols && sharp[y * g.cols + xa] >= 0){ sv += sharp[y * g.cols + xa]; sc2++; }
        if (xb >= 0 && sharp[y * g.cols + xb] >= 0){ sv -= sharp[y * g.cols + xb]; sc2--; }
        if (x >= 0){ tmpV[y * g.cols + x] = sv; tmpC[y * g.cols + x] = sc2; }
      }
    }
    const locV = new Float32Array(n), locC = new Float32Array(n);
    for (let x = 0; x < g.cols; x++){
      let sv = 0, sc2 = 0;
      for (let y = -R2; y < g.rows; y++){
        const ya = y + R2, yb = y - R2 - 1;
        if (ya < g.rows){ sv += tmpV[ya * g.cols + x]; sc2 += tmpC[ya * g.cols + x]; }
        if (yb >= 0){ sv -= tmpV[yb * g.cols + x]; sc2 -= tmpC[yb * g.cols + x]; }
        if (y >= 0){ locV[y * g.cols + x] = sv; locC[y * g.cols + x] = sc2; }
      }
    }
    for (let i = 0; i < n; i++){
      if (sharp[i] < 0) continue;
      const mean = locC[i] > 0 ? locV[i] / locC[i] : sharp[i];
      sharp[i] = Math.min(1, Math.max(0, sharp[i] + .45 * (sharp[i] - mean)));
    }
  }
  function unionRows(){
    const y1 = Math.min(g.rows, cur.row + 10);
    for (let y = cur.row; y < y1; y++) for (let x = 0; x < g.cols; x++){
      const i = y * g.cols + x;
      if (raw[i] < 0) continue;
      const th = (BAYER[y & 3][x & 3] + .5) / 16;
      let vars = null, any = false;
      for (let t = 0; t < 2; t++){
        const T = tones[t], v = T.sharp[i];
        if (v < 0) continue;
        const gx = T.va(x+1,y-1)+2*T.va(x+1,y)+T.va(x+1,y+1)-T.va(x-1,y-1)-2*T.va(x-1,y)-T.va(x-1,y+1);
        const gy = T.va(x-1,y+1)+2*T.va(x,y+1)+T.va(x+1,y+1)-T.va(x-1,y-1)-2*T.va(x,y-1)-T.va(x+1,y-1);
        const mg = Math.hypot(gx, gy);
        if (t === 1) mag2[i] = mg;            // the dense tone's edges are the linework
        const mag = mg * (opts.edge === undefined ? 1 : opts.edge);
        for (let m = 0; m < NM; m++){
          const vv = modeCell(MODES[m], v, mag, th, inkFn);
          if (vv){
            if (!vars) vars = new Array(NM * 2).fill(null);
            vv.jx = jit(); vv.jy = jit();
            vars[t * NM + m] = vv; any = true;
          }
        }
      }
      if (any) union.push({x, y, vars, tr:null});
    }
    cur.row = y1;
    return y1 >= g.rows;
  }
  /* ── LAYER 1 · THE MAP ────────────────────────────────────────────────────
     A static Uint8Array, thresholded off the dense tone, and the only thing
     collision ever reads. It is deliberately NOT built from `union`: union is
     a shuffled, capped sample of what the skin happens to draw, and every one
     of its cells fades in and out on its own clock. Ground has to be a fact.

     `mass` is the lit form — a face's cheek is a hill you can run over.
     `lines` is the Sobel edge — scaffolding to climb, sparse and airy.
     `both` is the union of the two, which is what most photos want.

     A threshold that lights nothing is a picture with no floor in it, so walk
     it down until there is somewhere to stand. Silently having no ground is
     the one failure that reads as "the character is broken".                */
  function buildMap(){
    const mode = opts.mapMode | 0;
    const sharp = tones[1].sharp;
    const solid = new Uint8Array(n);
    let mmax = 0;
    for (let i = 0; i < n; i++) if (mag2[i] > mmax) mmax = mag2[i];
    const mnorm = mmax > 0 ? 1 / mmax : 0;
    const fill = thr => {
      let count = 0;
      for (let i = 0; i < n; i++){
        if (sharp[i] < 0){ solid[i] = 0; continue; }
        const massHit = sharp[i] >= thr;
        const lineHit = mag2[i] * mnorm >= thr * .55;
        const hit = mode === 1 ? lineHit : (mode === 2 ? (massHit || lineHit) : massHit);
        solid[i] = hit ? 1 : 0;
        if (hit) count++;
      }
      return count;
    };
    let thr = Math.min(.95, Math.max(.05, opts.mapThr === undefined ? .55 : opts.mapThr));
    let count = fill(thr);
    const floorNeed = Math.max(120, n * .006);
    for (let guard = 0; count < floorNeed && thr > .06 && guard < 24; guard++){
      thr -= .04;
      count = fill(thr);
    }
    g.solid = solid;
    g.solidCount = count;
    g.mapThr = thr;
  }
  function finish(){
    if (!union.length){ dead = true; return; }
    buildMap();
    if (union.length > GR.cap){ shuffle(union); union.length = GR.cap; }
    const poolM = [];
    for (let m = 0; m < NM; m++) for (let k2 = 0; k2 < (m === 0 ? 3 : 1); k2++) poolM.push(m);
    const phase = Math.random() * 6.28318;
    const nn = performance.now();
    const tide0 = .5 + .5 * Math.sin(nn * .0004 + phase);
    for (const c of union){
      let vv = null;
      for (let tr2 = 0; tr2 < 6 && !vv; tr2++){
        const t = Math.random() < tide0 ? 1 : 0;
        const m = poolM[(Math.random() * poolM.length) | 0];
        vv = c.vars[t * NM + m] || c.vars[(1 - t) * NM + m];
      }
      if (!vv) vv = c.vars.find(Boolean);
      c.d = {g:vv.g, al:vv.al, sz:vv.sz, jx:vv.jx, jy:vv.jy};
      c.next = nn + 500 + Math.random() * 6000;
    }
    if (opts.fullColor){
      if (opts.quantize) quantizePalette(union, d, g.cols, 64);
      else {
        /* FULL ink: every diamond samples its own source pixel
           (gentle lift keeps it vivid on black) */
        for (const c of union){
          const i2 = (c.y * g.cols + c.x) * 4;
          let r = d[i2], g2 = d[i2 + 1], b = d[i2 + 2];
          const mx = Math.max(r, g2, b);
          if (mx > 0){ const s = Math.min(255 / mx, 1.28);
            r = Math.min(255, (r * s) | 0); g2 = Math.min(255, (g2 * s) | 0); b = Math.min(255, (b * s) | 0); }
          c.rgb2 = [r, g2, b];
        }
      }
    }
    g.cells = union.map(c => ({x:c.x, y:c.y, g:c.d.g, rgb:c.rgb2 || opts.rgb, al:c.d.al, sz:c.d.sz, jx:c.d.jx, jy:c.d.jy, lc:c}));
    g._live = {cells:union, rgb:opts.rgb, poolM, nm:NM, phase};
    out = g;
  }
  return {
    step(){
      if (dead) return true;
      try{
        switch (cur.phase){
          case 0: raster(); cur.phase = 1; cur.t = 0; cur.row = 0; break;
          case 1: if (sharpRows()) cur.phase = 2; break;
          case 2: localPass();
                  if (cur.t === 0){ cur.t = 1; cur.row = 0; cur.phase = 1; }
                  else { cur.phase = 3; cur.row = 0; }
                  break;
          case 3: if (unionRows()) cur.phase = 4; break;
          case 4: finish(); cur.phase = 5; break;
          default: return true;
        }
      }catch(err){ dead = true; }
      return dead || cur.phase >= 5;
    },
    result(){ return dead ? null : out; }
  };
}
function imageGrid(cv, srcCv, opts){
  const b = makeBuilder(cv, srcCv, opts);
  if (!b) return null;
  while (!b.step());
  return b.result();
}
function imageGridAsync(cv, srcCv, opts, cb){
  const b = makeBuilder(cv, srcCv, opts);
  if (!b){ cb(null); return () => {}; }
  let dead = false;
  const tick = () => {
    if (dead) return;
    const t0 = performance.now();
    let fin = false;
    while (performance.now() - t0 < 6){ if (b.step()){ fin = true; break; } }
    if (fin) cb(b.result());
    else setTimeout(tick, 16);
  };
  setTimeout(tick, 0);
  return () => { dead = true; };
}
/* empty-state plate: concentric diamond seal, with a floor to stand on */
function holderGrid(cv){
  const g = gridShell(cv, 72);
  if (!g) return null;
  const cx = (g.cols - 1) / 2, cy = (g.rows - 1) / 2;
  const solid = new Uint8Array(g.cols * g.rows);
  for (let y = 0; y < g.rows; y++) for (let x = 0; x < g.cols; x++){
    const dd = Math.abs(x - cx) + Math.abs(y - cy);
    if (dd <= 1.2){ g.cells.push({x, y, g:1, rgb:RGBV.flare, al:.95}); solid[y*g.cols+x] = 1; continue; }
    if (x === 0 || y === 0 || x === g.cols - 1 || y === g.rows - 1){
      g.cells.push({x, y, g:2, rgb:RGBV.bone});
      solid[y*g.cols+x] = 1;
      continue;
    }
    if (dd > 3 && Math.round(dd) % 8 === 0){
      g.cells.push({x, y, g:2, rgb:RGBV.bone, al:.5});
      solid[y*g.cols+x] = 1;
    }
  }
  g.solid = solid;
  g.solidCount = 1;
  return roughen(g);
}

/* ── ambient ground — faint archipelago, drawn once, its own canvas ──────── */
function bgRender(){
  const cv = $('#bg');
  const d = sizeCanvas(cv);
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  const p = Math.max(4, Math.round(7 * d));
  const cols = Math.ceil(cv.width / p), rows = Math.ceil(cv.height / p);
  const seed = 4211;
  const R = (x, y) => {
    let h = (x * 374761393 + y * 668265263) ^ seed;
    h = (h ^ (h >> 13)) * 1274126177;
    return ((h ^ (h >> 16)) >>> 0) / 4294967295;
  };
  const sm = t => t * t * (3 - 2 * t);
  const vn = (x, y) => {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = sm(x - ix), fy = sm(y - iy);
    const a = R(ix, iy), b = R(ix + 1, iy), c = R(ix, iy + 1), e = R(ix + 1, iy + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + e) * fx * fy;
  };
  const land = new Uint8Array(cols * rows);
  for (let y = 0; y < rows; y++){
    const thr = .88 - (y / rows) * .36;
    for (let x = 0; x < cols; x++){
      const nv = vn(x * .085, y * .085) * .7 + vn(x * .21, y * .21) * .3;
      if (nv > thr) land[y * cols + x] = 1;
    }
  }
  const L = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows && land[y * cols + x] === 1;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = Math.round(p * 1.5) + 'px ' + MONO;
  ctx.fillStyle = COL.bone;
  const edges = [];
  ctx.globalAlpha = .05;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++){
    if (!L(x, y)) continue;
    if (L(x-1,y) && L(x+1,y) && L(x,y-1) && L(x,y+1))
      ctx.fillText('◆', x * p + p / 2, y * p + p / 2);
    else edges.push(x, y);
  }
  ctx.globalAlpha = .11;
  for (let i = 0; i < edges.length; i += 2)
    ctx.fillText('◇', edges[i] * p + p / 2, edges[i + 1] * p + p / 2);
  ctx.fillStyle = COL.flare; ctx.globalAlpha = .5;
  for (let k = 0; k < 3 && edges.length; k++){
    const j = (Math.floor(R(k * 71, k * 913) * (edges.length / 2)) * 2);
    ctx.fillText('◆', edges[j] * p + p / 2, edges[j + 1] * p + p / 2);
  }
  ctx.globalAlpha = 1;
}

/* ═══════════════════════════════════════════════════════════════════════════
   LAYER 3 · THE RUNNER

   Pixel maps rather than art: one character per art-pixel, '.' transparent,
   keyed into a palette. Every art-pixel is one hard square in the same
   instance buffer as the diamonds, so the whole frame — picture and character
   together — is still one draw call.

   Swapping in a sprite sheet replaces PIX and drawPixmap and nothing else:
   the body, the physics and the collision are all in cell units and know
   nothing about how the runner is painted.
   ═════════════════════════════════════════════════════════════════════════ */
const SHEET = null;   /* no sheet imported — the built-in maps run */

/* An imported sheet, decoded once. One character per art-pixel: '.' is
   transparent and the rest index the palette, which is why the importer caps
   it at 63 colours. Mirroring is a property of the ART, not of the engine — a
   sheet drawn facing the camera must not flip, or the sword changes hands
   every time you turn around. */
const SPRITE = (function(){
  if (typeof SHEET !== 'object' || !SHEET) return null;
  const idx = new Uint8Array(128);
  const CH = '.0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ+';
  for (let i = 0; i < CH.length; i++) idx[CH.charCodeAt(i)] = i;
  /* THE RIM. Imported art has no idea it is going to stand on a near-black
     field. This ranger is forest green and dark leather; on the picture it
     reads, and the moment it steps off one it disappears. So every frame gets
     its silhouette — the transparent cells orthogonally touching an opaque one
     — painted behind it in bone at low alpha. It is the oldest trick in the
     genre and it costs about 150 more squares in a buffer that is already
     carrying six thousand. `?rim=0` turns it off, and it never applies to the
     built-in maps, which were drawn in flare pink for exactly this reason. */
  const W = SHEET.w, H = SHEET.h;
  const rims = SHEET.frames.map(str => {
    const out = [];
    for (let r = 0, i = 0; r < H; r++) for (let c = 0; c < W; c++, i++){
      if (idx[str.charCodeAt(i)]) continue;
      if ((c > 0     && idx[str.charCodeAt(i - 1)]) ||
          (c < W - 1 && idx[str.charCodeAt(i + 1)]) ||
          (r > 0     && idx[str.charCodeAt(i - W)]) ||
          (r < H - 1 && idx[str.charCodeAt(i + W)])) out.push(i);
    }
    return Uint16Array.from(out);
  });
  return {
    w: W, h: H, fps: SHEET.fps || 12,
    aspect: W / H,
    mirror: SHEET.mirror !== false,
    idx, rims,
    rim: QS.get('rim') === '1',
    pal: SHEET.pal.map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]),
    frames: SHEET.frames, anim: SHEET.anim,
  };
})();

const SPAL = {
  r:[255,95,162],    /* the body, flare pink — visible on the near-black field */
  s:[237,234,227],   /* the eye, page bone       */
  a:[121,224,216],   /* motion trail, aqua       */
};
/* 12 wide, 16 tall — v3's character is one of the lattice's own glyphs grown

   apart by shape, not costume: lean is the run, stretch is the air (the aqua
   trail marks which way it is moving), and the climb shifts flank to flank.
   Facing right; drawPixmap mirrors. */
const PIX = {
  idle: [
    '............',
    '.....rr.....',
    '....rrrr....',
    '...rrrrrr...',
    '...rrrrrr...',
    '..rrrrrrsr..',
    '.rrrrrrrsrr.',
    '.rrrrrrrrrr.',
    '.rrrrrrrrrr.',
    '.rrrrrrrrrr.',
    '..rrrrrrrr..',
    '...rrrrrr...',
    '...rrrrrr...',
    '....rrrr....',
    '.....rr.....',
    '............',
  ],
  run1: [
    '............',
    '......rr....',
    '.....rrrr...',
    '....rrrrr...',
    '....rrrrrr..',
    '...rrrrrsr..',
    '..rrrrrrsrr.',
